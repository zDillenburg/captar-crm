<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Corretor — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --purple:#850277;--purple-light:#a3039a;--purple-dark:#620158;
    --black:#100e0d;--ink:#0a0908;--base:#100e0d;--surface:#17140f;--surface-2:#1d1916;
    --line:rgba(255,253,234,.085);--line-mid:rgba(255,253,234,.14);--line-strong:rgba(255,253,234,.22);
    --t-100:#fffdea;--t-70:rgba(255,253,234,.70);--t-55:rgba(255,253,234,.55);--t-40:rgba(255,253,234,.52);--t-28:rgba(255,253,234,.46);
    --r-xs:6px;--r-sm:10px;--r:14px;--r-lg:22px;
    --ease:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.4,0,.2,1);
  }
  body.light-mode{
    --black:#fffdea;--ink:#fffdea;--base:#fffdea;--surface:#f5f3e4;--surface-2:#ece9d5;
    --line:rgba(16,14,13,.08);--line-mid:rgba(16,14,13,.14);--line-strong:rgba(16,14,13,.24);
    --t-100:#100e0d;--t-70:rgba(16,14,13,.72);--t-55:rgba(16,14,13,.56);--t-40:rgba(16,14,13,.48);--t-28:rgba(16,14,13,.40);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--base);color:var(--t-100);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background .25s ease,color .25s ease}
  a{color:inherit}
  ::selection{background:var(--purple-light);color:#fff}

  header{display:flex;align-items:center;justify-content:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--base) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:24px;width:auto;opacity:.92}
  body.light-mode header img{filter:brightness(0) saturate(0);opacity:.82}
  .theme-toggle{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t-70);transition:background .2s ease,transform .2s var(--ease);
  }
  .theme-toggle:hover{background:var(--surface-2);transform:translateY(-50%) scale(1.06)}
  main{flex:1;display:flex;justify-content:center}
  .wrap{width:100%;max-width:680px;padding-bottom:130px}

  @media(prefers-reduced-motion:no-preference){
    /* SEM opacity aqui de propósito — uma versão anterior desse padrão
       (opacity:0 + animação com fill-mode forwards) podia deixar a
       página inteira invisível pra sempre se a animação nunca
       terminasse de verdade (aba em segundo plano, navegador suspendendo
       a animação). Só animar `transform` garante que o conteúdo esteja
       sempre visível desde o primeiro frame, não importa o que aconteça
       com a animação. */
    .fade-up{transform:translateY(14px);animation:fadeUp .6s var(--ease) forwards}
    .fade-up.d1{animation-delay:.06s}
    .fade-up.d2{animation-delay:.12s}
    .fade-up.d3{animation-delay:.18s}
    .fade-up.d4{animation-delay:.24s}
    @keyframes fadeUp{to{transform:translateY(0)}}
    .card-in{transform:translateY(16px) scale(.98);animation:cardIn .55s var(--ease) forwards;animation-delay:calc(var(--i, 0) * 45ms)}
    @keyframes cardIn{to{transform:translateY(0) scale(1)}}
  }
  @media(prefers-reduced-motion:reduce){
    .fade-up,.card-in{opacity:1!important;transform:none!important;animation:none!important}
  }

  .state-box{text-align:center;padding:120px 20px;color:var(--t-40);max-width:380px;margin:0 auto}
  .state-box svg{width:32px;height:32px;margin-bottom:20px;opacity:.5}
  .state-box p{font-size:15px;line-height:1.6}

  /* ── Skeleton de carregamento — já sugere o layout final ── */
  .skel{background:linear-gradient(90deg, var(--surface) 22%, var(--surface-2) 40%, var(--surface) 58%);background-size:400% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--r)}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-20% 0}}
  .skel-wrap{padding-bottom:60px}
  .skel-banner{height:180px;border-radius:0}
  .skel-head{padding:0 28px;margin-top:-40px;position:relative}
  .skel-avatar{width:88px;height:88px;border-radius:22px;border:3px solid var(--base)}
  .skel-pad{padding:24px 28px 0}
  .skel-line{height:14px;margin-bottom:10px}
  .skel-stats{display:flex;gap:10px;padding:0 28px;margin:24px 0}
  .skel-stat{flex:1;height:64px;border-radius:16px}
  .skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 28px}
  .skel-card{height:230px}
  @media(prefers-reduced-motion:reduce){.skel{animation:none;background:var(--surface)}}

  /* ── Banner + avatar ─────────────────────────────── */
  .banner{height:190px;background:var(--surface);position:relative;overflow:hidden}
  .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--base) 100%);opacity:.85}
  .banner img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
  .profile-head{padding:0 28px;margin-top:-44px;position:relative;z-index:2}
  .profile-avatar-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
  .profile-logo,.profile-avatar-fallback{width:88px;height:88px;border-radius:22px;flex-shrink:0;border:3px solid var(--base);box-shadow:0 16px 32px -8px rgba(0,0,0,.55)}
  .profile-logo{object-fit:contain;background:#fff}
  .profile-avatar-fallback{background:linear-gradient(160deg,var(--purple-light),var(--purple-dark));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
  .profile-social{display:flex;gap:8px;margin-bottom:4px}
  .profile-social a{
    width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--t-70);transition:background .18s,color .18s,transform .18s var(--ease);
  }
  .profile-social a:hover{background:var(--purple);color:#fff;transform:translateY(-2px)}
  .profile-social svg{width:15px;height:15px}

  .wrap-pad{padding:0 28px}
  .verified-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t-40);font-weight:600;margin-bottom:9px;letter-spacing:.01em}
  .verified-line svg{width:13px;height:13px;color:var(--purple-light);flex-shrink:0}
  .profile-name{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:9px}
  .profile-tagline{font-size:16px;color:var(--t-70);line-height:1.55;margin-bottom:24px;max-width:48ch;font-weight:500}

  .stat-row{display:flex;gap:10px;margin-bottom:28px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;transition:background .2s,border-color .2s}
  .stat-val{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--t-100)}
  .stat-lbl{font-size:11px;color:var(--t-40);margin-top:4px;font-weight:600;letter-spacing:.02em}
  .stat-line{font-size:14px;color:var(--t-40);margin-bottom:28px;font-weight:600}

  .profile-bio{font-size:16px;line-height:1.65;color:var(--t-70);font-weight:500;margin-bottom:28px;max-width:56ch}

  .section-label{font-size:13px;font-weight:700;color:var(--t-40);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .section-label-count{font-weight:600;color:var(--t-28)}

  /* ── Barra de busca + filtro ─────────────────────── */
  .search-row{display:flex;gap:8px;margin-bottom:16px}
  .search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;transition:border-color .2s}
  .search-box:focus-within{border-color:var(--purple-light)}
  .search-box svg{width:16px;height:16px;color:var(--t-40);flex-shrink:0}
  .search-box input{flex:1;background:none;border:none;outline:none;color:var(--t-100);font:inherit;font-size:14.5px;padding:12px 0;font-family:'Manrope',sans-serif}
  .search-box input::placeholder{color:var(--t-28)}
  .filter-toggle{
    position:relative;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:0 16px;color:var(--t-70);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .2s,color .2s;flex-shrink:0;font-family:inherit;
  }
  .filter-toggle svg{width:15px;height:15px}
  .filter-toggle.active{border-color:var(--purple-light);color:var(--t-100)}
  .filter-toggle-badge{
    position:absolute;top:-6px;right:-6px;background:var(--purple-light);color:#fff;font-size:10px;font-weight:800;
    width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }

  .filter-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:39;opacity:0;visibility:hidden;transition:opacity .25s ease}
  .filter-backdrop.open{opacity:1;visibility:visible}
  .filter-panel{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;z-index:40;
    background:var(--surface);border:1px solid var(--line-mid);border-bottom:none;border-radius:22px 22px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom));transition:transform .35s var(--ease);
    max-height:80vh;overflow-y:auto;box-shadow:0 -24px 60px -20px rgba(0,0,0,.6);
  }
  .filter-panel.open{transform:translate(-50%,0)}
  .filter-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .filter-panel-head h3{font-size:16px;font-weight:800}
  .filter-panel-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:none;color:var(--t-70);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .filter-field{margin-bottom:16px}
  .filter-field label{display:block;font-size:12px;font-weight:700;color:var(--t-40);letter-spacing:.02em;margin-bottom:8px}
  .filter-field select,.filter-field input{
    width:100%;background:var(--surface-2);border:1px solid var(--line-mid);border-radius:var(--r-sm);color:var(--t-100);
    font:inherit;font-size:14.5px;padding:11px 12px;outline:none;transition:border-color .2s;font-family:'Manrope',sans-serif;
  }
  .filter-field select:focus,.filter-field input:focus{border-color:var(--purple-light)}
  .filter-field-row{display:flex;gap:10px}
  .filter-field-row .filter-field{flex:1;margin-bottom:0}
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px}
  .filter-chip{
    background:var(--surface-2);border:1px solid var(--line-mid);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;
    color:var(--t-55);cursor:pointer;transition:background .18s,border-color .18s,color .18s;font-family:inherit;
  }
  .filter-chip.active{background:var(--purple);border-color:var(--purple);color:#fff}
  .filter-actions{display:flex;gap:10px;margin-top:20px}
  .filter-clear{flex:1;background:none;border:1px solid var(--line-mid);border-radius:var(--r-sm);color:var(--t-55);font:inherit;font-weight:700;font-size:14px;padding:13px;cursor:pointer;transition:border-color .18s,color .18s}
  .filter-clear:hover{border-color:var(--line-strong);color:var(--t-100)}
  .filter-apply{flex:1;background:var(--purple);border:none;border-radius:var(--r-sm);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:13px;cursor:pointer;transition:background .18s}
  .filter-apply:hover{background:var(--purple-light)}

  .vender-cta{
    display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(133,2,119,.14),rgba(163,3,154,.06));
    border:1px solid var(--purple-light);border-radius:18px;padding:18px 20px;margin-bottom:28px;text-align:left;width:100%;
    cursor:pointer;font-family:inherit;transition:border-color .2s,transform .2s var(--ease);
  }
  .vender-cta:hover{border-color:var(--purple);transform:translateY(-2px)}
  .vender-cta-icon{width:42px;height:42px;border-radius:12px;background:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vender-cta-icon svg{width:20px;height:20px;color:#fff}
  .vender-cta-title{font-size:15px;font-weight:800;color:var(--t-100);margin-bottom:2px}
  .vender-cta-sub{font-size:13px;color:var(--t-55)}
  .vender-feedback{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:10px;display:none}
  .vender-feedback.ok{display:block;background:rgba(34,197,94,.12);color:#4ade80}
  .vender-feedback.err{display:block;background:rgba(239,68,68,.12);color:#f87171}

  .vendidos-section{margin-bottom:28px}
  .vendidos-title{font-size:13px;font-weight:800;color:var(--t-70);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .vendidos-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .vendido-card{flex:0 0 auto;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .vendido-card-img{height:90px;position:relative;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:22px}
  .vendido-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .vendido-tag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 7px;border-radius:20px;background:rgba(34,197,94,.92);color:#0a1f0f;z-index:1}
  .vendido-card-body{padding:10px 12px}
  .vendido-card-price{font-size:12.5px;font-weight:800;color:var(--t-100)}
  .vendido-card-addr{font-size:10.5px;color:var(--t-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  .depoimentos-section{margin-top:36px}
  .depoimentos-title{font-size:13px;font-weight:800;color:var(--t-70);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
  .depoimentos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .depoimento-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .depoimento-stars{font-size:12px;color:#f5a623;margin-bottom:8px}
  .depoimento-texto{font-size:13.5px;color:var(--t-70);line-height:1.55;margin-bottom:12px}
  .depoimento-nome{font-size:12.5px;font-weight:700;color:var(--t-100)}

  .im-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .im-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .32s var(--ease),box-shadow .32s var(--ease),border-color .32s var(--ease)}
  @media(hover:hover){
    .im-card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -18px rgba(0,0,0,.55);border-color:var(--line-strong)}
    .im-card:hover .im-card-img img{transform:scale(1.06)}
  }
  .im-card:active{transform:translateY(-2px) scale(.99)}
  .im-card-img{height:150px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden;background:var(--surface-2)}
  .im-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;transition:transform .5s var(--ease)}
  .im-card-emoji{position:relative;z-index:1;opacity:.85}
  .im-card-status{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(8px);z-index:2}
  .im-card-destaque{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:20px;background:linear-gradient(135deg,#f5a623,#ef8f0f);color:#1a1200;z-index:2}
  .im-card-aluguel{position:absolute;bottom:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:20px;background:rgba(59,130,246,.92);color:#0a1526;z-index:2}
  .im-card-like{
    position:absolute;bottom:10px;right:10px;z-index:2;display:flex;align-items:center;gap:5px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:none;border-radius:20px;
    padding:6px 10px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;
    transition:background .18s,transform .18s var(--ease);
  }
  .im-card-like svg{width:13px;height:13px;transition:transform .25s var(--ease)}
  .im-card-like:hover{background:rgba(0,0,0,.75)}
  .im-card-like.liked{color:#ff5c8a}
  .im-card-like.liked svg{fill:#ff5c8a;stroke:#ff5c8a;transform:scale(1.15)}
  .im-card-body{padding:16px}
  .im-card-price{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .im-card-addr{font-size:12.5px;color:var(--t-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:11px;font-weight:600}
  .im-card-specs{display:flex;gap:12px;font-size:11.5px;color:var(--t-55);font-weight:700}
  .im-card-specs span{display:flex;align-items:center;gap:4px}
  .im-card-specs svg{width:12px;height:12px;opacity:.7}

  .empty-imoveis{text-align:center;padding:56px 24px;color:var(--t-40);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;line-height:1.6}
  .empty-imoveis svg{width:28px;height:28px;opacity:.5;margin-bottom:14px}
  .empty-clear-btn{margin-top:16px;background:var(--purple);border:none;border-radius:var(--r-sm);color:#fff;font:inherit;font-weight:700;font-size:13.5px;padding:10px 18px;cursor:pointer}

  footer{text-align:center;padding:24px;font-size:12.5px;color:var(--t-40)}
  footer a{color:var(--t-70);text-decoration:none;font-weight:700}

  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--base) 84%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex;justify-content:center;
  }
  .sticky-cta a{
    width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#25d366;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:14px;text-decoration:none;
    transition:filter .18s,transform .18s var(--ease);
  }
  .sticky-cta a:hover{filter:brightness(1.08)}
  .sticky-cta a:active{transform:scale(.98)}
  .sticky-cta svg{width:19px;height:19px;flex-shrink:0}

  @media(max-width:600px){
    .banner{height:150px}
    .profile-name{font-size:26px}
    .stat-row{gap:8px}
  }
</style>
</head>
<body>

  <header>
    <a href="/index.html">
      <img src="/logo.svg" alt="Grupo Captar"/>
    </a>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="skel-wrap">
        <div class="skel skel-banner"></div>
        <div class="skel-head"><div class="skel skel-avatar"></div></div>
        <div class="skel-pad">
          <div class="skel skel-line" style="width:55%;height:26px;margin-top:22px"></div>
          <div class="skel skel-line" style="width:38%"></div>
        </div>
        <div class="skel-stats"><div class="skel skel-stat"></div><div class="skel skel-stat"></div><div class="skel skel-stat"></div></div>
        <div class="skel-grid">
          <div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Perfil de <a href="/index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

<script>

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

function fotoPublicUrl(bucket, path){

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}

// im.preco é texto livre (ex: "R$ 850.000") — parseia pra número em reais
// pra permitir filtro por faixa de preço, sem exigir mudança de schema.
function parseMoneyBR(v){
  if(v==null)return null;
  const s=String(v).replace(/[^\d.,]/g,'').trim();
  if(!s)return null;
  let n;
  if(s.includes('.')&&s.includes(',')) n=parseFloat(s.replace(/\./g,'').replace(',','.'));
  else if(s.includes(',')) n=parseFloat(s.replace(',','.'));
  else n=parseInt(s.replace(/\./g,''),10);
  return Number.isFinite(n)?n:null;
}

function uniqueSorted(arr){
  return Array.from(new Set(arr.filter(Boolean).map(v=>String(v).trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

// ── estado do filtro/busca — tudo client-side, a lista inteira já está em memória ──
let _lista = [];
let _filters = { q:'', tipo:'', status:'', quartosMin:0, precoMin:null, precoMax:null };
let _venderUserId = null;

function matchesFilters(im){
  if(_filters.tipo && String(im.tipo||'').trim() !== _filters.tipo) return false;
  if(_filters.status && String(im.status||'').trim() !== _filters.status) return false;
  if(_filters.quartosMin && Number(im.quartos||0) < _filters.quartosMin) return false;
  if(_filters.precoMin!=null || _filters.precoMax!=null){
    const p = parseMoneyBR(im.preco);
    if(p==null) return false;
    if(_filters.precoMin!=null && p < _filters.precoMin) return false;
    if(_filters.precoMax!=null && p > _filters.precoMax) return false;
  }
  if(_filters.q){
    const hay = `${im.endereco||''} ${im.titulo||''} ${im.tipo||''}`.toLowerCase();
    if(!hay.includes(_filters.q.toLowerCase())) return false;
  }
  return true;
}

function activeFilterCount(){
  let n=0;
  if(_filters.tipo)n++;
  if(_filters.status)n++;
  if(_filters.quartosMin)n++;
  if(_filters.precoMin!=null||_filters.precoMax!=null)n++;
  return n;
}

function renderGrid(){
  const grid = document.getElementById('im-grid');
  // O container pode estar como grade (#im-grid) ou como estado vazio
  // (#im-grid-empty) dependendo do filtro anterior — sempre pegar o que
  // existir agora, senão uma mudança de filtro a partir do estado vazio
  // não teria nenhum elemento pra substituir e ficaria travada sem atualizar.
  const current = grid || document.getElementById('im-grid-empty');
  const countEl = document.getElementById('result-count');
  if(!current) return;
  const filtered = _lista.filter(matchesFilters);
  const hasActiveFilter = activeFilterCount() > 0 || !!_filters.q;
  if(countEl) countEl.textContent = hasActiveFilter ? `${filtered.length} de ${_lista.length}` : `${_lista.length}`;

  if(!filtered.length){
    current.outerHTML = `<div class="empty-imoveis" id="im-grid-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON_EMPTY}</svg>
      ${_lista.length ? 'Nenhum imóvel encontrado com esses filtros.' : 'Nenhum imóvel compartilhado publicamente no momento.'}
      ${_lista.length && hasActiveFilter ? `<div><button class="empty-clear-btn" onclick="clearAllFilters()">Limpar filtros</button></div>` : ''}
    </div>`;
    return;
  }
  current.outerHTML = `<div class="im-grid" id="im-grid">${filtered.map((im,i)=>imCardHtml(im,i)).join('')}</div>`;
}

function onFilterChange(){

function updateFilterChipsUI(){

function updateFilterToggleUI(){

// Curtir direto no card da grade — mesmo evento 'like' usado na página
// de detalhe do imóvel (ver supabase-propostas-publicas.sql).
function curtirImovelCard(id, btn){
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('liked');
  const countEl = btn.querySelector('span');
  countEl.textContent = String(Number(countEl.textContent || 0) + 1);
  localStorage.setItem('captar_curtiu_' + id, '1');
  const desfazer = () => {
    btn.disabled = false;
    btn.classList.remove('liked');
    countEl.textContent = String(Math.max(0, Number(countEl.textContent || 1) - 1));
    localStorage.removeItem('captar_curtiu_' + id);
  };
  // .then(ok,fail) sozinho não pega erro do Postgres — o client do
  // Supabase resolve a promise normalmente e devolve { error } dentro
  // dela, não rejeita (mesmo detalhe corrigido em imovel-publico.html).
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'like' })
    .then(({ error }) => { if(error) desfazer(); }, desfazer);
}

async function load(){

  // slug só aparece em location.pathname. Por isso o ?u= no destino do
  // rewrite serve só de documentação — na prática precisamos ler o path.
  const pathMatch = location.pathname.match(/\/c\/([^/]+)\/?$/);
  const slug = params.get('u') || (pathMatch ? decodeURIComponent(pathMatch[1]) : '');
  let id = params.get('id');

    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do corretor.');

            <div class="vendido-card">
              <div class="vendido-card-img">
                <span class="vendido-tag">Vendido</span>
                ${Array.isArray(im.fotos)&&im.fotos.length
                  ? `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" alt="" onerror="this.remove()"/>`
                  : `<span>${escHtml(im.emoji||'🏠')}</span>`}
              </div>
              <div class="vendido-card-body">
                <div class="vendido-card-price">${escHtml(im.preco||'—')}</div>
                <div class="vendido-card-addr">${escHtml(im.endereco||'—')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      <div class="section-label">
        <span>Imóveis disponíveis</span>
        <span class="section-label-count" id="result-count">${_lista.length}</span>
      </div>

      ${mostrarFiltro ? `
      <div class="search-row fade-up d4">
        <div class="search-box">
          ${ICON_SEARCH}
          <input type="text" placeholder="Buscar por endereço, bairro…" oninput="onSearchInput(this.value)"/>
        </div>
        <button class="filter-toggle" id="filter-toggle-btn" onclick="toggleFilterPanel()">
          ${ICON_FILTER}<span>Filtrar</span>
          <span class="filter-toggle-badge" id="filter-badge" style="display:none">0</span>
        </button>
      </div>
      ` : ''}

      ${_lista.length ? `
        <div class="im-grid" id="im-grid">
          ${_lista.map((im,i)=>imCardHtml(im,i)).join('')}
        </div>
      ` : `<div class="empty-imoveis" id="im-grid-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON_EMPTY}</svg>Nenhum imóvel compartilhado publicamente no momento.</div>`}

      ${depoimentos.length ? `
      <div class="depoimentos-section fade-up">
        <div class="depoimentos-title">O que meus clientes dizem</div>
        <div class="depoimentos-grid">
          ${depoimentos.slice(0,6).map(d=>`
            <div class="depoimento-card">
              <div class="depoimento-stars">${'⭐'.repeat(Math.max(1,Math.min(5,d.nota||5)))}</div>
              <p class="depoimento-texto">"${escHtml(d.texto)}"</p>
              <div class="depoimento-nome">${escHtml(d.nome_cliente)}</div>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}
    </div>
  `;

  if(mostrarFiltro){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="filter-backdrop" id="filter-backdrop" onclick="toggleFilterPanel(false)"></div>
      <div class="filter-panel" id="filter-panel">
        <div class="filter-panel-head">
          <h3>Filtrar imóveis</h3>
          <button class="filter-panel-close" onclick="toggleFilterPanel(false)">${ICON_X}</button>
        </div>
        ${tipos.length ? `
        <div class="filter-field">
          <label>Tipo</label>
          <select id="f-tipo" onchange="onFilterChange()">
            <option value="">Todos</option>
            ${tipos.map(t=>`<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('')}
          </select>
        </div>` : ''}
        ${statuses.length ? `
        <div class="filter-field">
          <label>Status</label>
          <select id="f-status" onchange="onFilterChange()">
            <option value="">Todos</option>
            ${statuses.map(s=>`<option value="${escHtml(s)}">${escHtml(s)}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="filter-field">
          <label>Quartos (mínimo)</label>
          <div class="filter-chips">
            ${[1,2,3,4].map(n=>`<button type="button" class="filter-chip" data-val="${n}" onclick="setQuartosMin(${n})">${n}+</button>`).join('')}
          </div>
        </div>
        <div class="filter-field-row">
          <div class="filter-field">
            <label>Preço mínimo</label>
            <input type="number" id="f-preco-min" placeholder="R$ 0" oninput="onFilterChange()"/>
          </div>
          <div class="filter-field">
            <label>Preço máximo</label>
            <input type="number" id="f-preco-max" placeholder="Sem limite" oninput="onFilterChange()"/>
          </div>
        </div>
        <div class="filter-actions">
          <button class="filter-clear" onclick="clearFilters()">Limpar filtros</button>
          <button class="filter-apply" onclick="toggleFilterPanel(false)">Ver resultados</button>
        </div>
      </div>
    `);
  }

  if(waPhone){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="sticky-cta">
        <a href="https://wa.me/${waPhone}?text=${waText}" target="_blank" rel="noopener noreferrer">${ICON_WHATSAPP} Falar no WhatsApp</a>
      </div>
    `);
  }

  document.body.insertAdjacentHTML('beforeend', `
    <div class="filter-backdrop" id="vender-backdrop" onclick="if(event.target===this)fecharVenderPanel()"></div>
    <div class="filter-panel" id="vender-panel">
      <div class="filter-panel-head">
        <h3>Quer vender ou alugar seu imóvel?</h3>
        <button class="filter-panel-close" onclick="fecharVenderPanel()">${ICON_X}</button>
      </div>
      <p style="font-size:13.5px;color:var(--t-55);line-height:1.55;margin-bottom:18px">Deixe seus dados que ${escHtml((perfil.nome||'o corretor').split(' ')[0])} entra em contato pra avaliar seu imóvel.</p>
      <form id="vender-form" onsubmit="return enviarVenda(event)">
        <div class="filter-field">
          <label>Seu nome</label>
          <input type="text" id="vender-nome" maxlength="120" required autocomplete="name"/>
        </div>
        <div class="filter-field">
          <label>Telefone / WhatsApp</label>
          <input type="text" id="vender-tel" maxlength="30" required autocomplete="tel" placeholder="(54) 99999-9999"/>
        </div>
        <div class="filter-field" style="margin-bottom:0">
          <label>Sobre o imóvel (endereço, tipo, valor esperado…)</label>
          <input type="text" id="vender-msg" maxlength="300" placeholder="Ex: apartamento 2 quartos no centro, quero alugar"/>
        </div>
        <div class="filter-actions">
          <button type="submit" class="filter-apply" id="vender-submit-btn" style="flex:1">Enviar</button>
        </div>
        <div class="vender-feedback" id="vender-feedback"></div>
      </form>
    </div>
  `);
}

function abrirVenderPanel(){
  const backdrop=document.getElementById('vender-backdrop'), panel=document.getElementById('vender-panel');
  if(!backdrop||!panel)return;
  backdrop.classList.add('open');
  panel.classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('vender-nome')?.focus(),300);
}

function fecharVenderPanel(){
  const backdrop=document.getElementById('vender-backdrop'), panel=document.getElementById('vender-panel');
  if(backdrop)backdrop.classList.remove('open');
  if(panel)panel.classList.remove('open');
  document.body.style.overflow='';
}

async function enviarVenda(event){
  event.preventDefault();
  const nome=document.getElementById('vender-nome').value.trim();
  const tel=document.getElementById('vender-tel').value.trim();
  const msg=document.getElementById('vender-msg').value.trim();
  const btn=document.getElementById('vender-submit-btn');
  const feedback=document.getElementById('vender-feedback');
  if(!nome||!tel){
    feedback.className='vender-feedback err';
    feedback.textContent='Preenche nome e telefone pra gente conseguir te retornar.';
    return false;
  }
  btn.disabled=true;
  feedback.className='vender-feedback';
  feedback.textContent='';
  try{
    const {error}=await _sb.rpc('enviar_proposta_publica',{
      p_user_id:_venderUserId, p_nome:nome, p_tel:tel, p_mensagem:msg,
      p_imovel_titulo:'Quer vender/alugar imóvel'
    });
    if(error)throw error;
    feedback.className='vender-feedback ok';
    feedback.textContent='Recebido! O corretor vai entrar em contato em breve.';
    document.getElementById('vender-form').reset();
    setTimeout(fecharVenderPanel,1800);
  }catch(e){
    feedback.className='vender-feedback err';
    feedback.textContent='Não deu pra enviar agora. Tenta de novo em instantes, ou fala direto pelo WhatsApp.';
  }finally{
    btn.disabled=false;
  }
  return false;
}

load();
</script>
</body>
