<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Corretor — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --p:#850277;--pl:#a3039a;--pd:#620158;
    --bg:#000000;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
    --border:rgba(255,255,255,0.09);
    --t1:#f5f5f7;--t2:rgba(245,245,247,.68);--t3:rgba(245,245,247,.42);
  }
  body.light-mode{
    --bg:#ffffff;--bg2:#f5f5f7;--bg3:#ececee;--bg4:#e2e2e5;
    --border:rgba(0,0,0,0.08);
    --t1:#1d1d1f;--t2:rgba(29,29,31,.68);--t3:rgba(29,29,31,.45);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background .2s ease,color .2s ease}
  a{color:inherit}

  header{display:flex;align-items:center;justify-content:center;padding:22px;border-bottom:1px solid var(--border);position:relative}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:26px;width:auto;opacity:.9}
  body.light-mode header img{filter:brightness(0) saturate(0);opacity:.85}
  .theme-toggle{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:var(--bg2);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2);
  }
  main{flex:1;display:flex;justify-content:center}
  .wrap{width:100%;max-width:640px;padding-bottom:120px}

  @media(prefers-reduced-motion:no-preference){
    .fade-up{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
    .fade-up.d1{animation-delay:.04s}
    .fade-up.d2{animation-delay:.09s}
    .fade-up.d3{animation-delay:.14s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  }

  .state-box{text-align:center;padding:120px 20px;color:var(--t3);max-width:380px;margin:0 auto}
  .state-box svg{width:32px;height:32px;margin-bottom:20px;opacity:.4}
  .state-box p{font-size:15px;line-height:1.6}

  /* ── Banner + avatar — quiet, no decoration ─────────────── */
  .banner{height:180px;background:var(--bg2)}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .profile-head{padding:0 28px;margin-top:-40px;position:relative}
  .profile-avatar-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
  .profile-logo,.profile-avatar-fallback{width:88px;height:88px;border-radius:22px;flex-shrink:0;border:3px solid var(--bg);box-shadow:0 12px 28px rgba(0,0,0,.45)}
  .profile-logo{object-fit:contain;background:#fff}
  .profile-avatar-fallback{background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:var(--t2)}
  .profile-social{display:flex;gap:8px;margin-bottom:4px}
  .profile-social a{
    width:34px;height:34px;border-radius:50%;background:var(--bg3);
    display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background .15s,color .15s;
  }
  .profile-social a:hover{background:var(--bg4);color:var(--t1)}
  .profile-social svg{width:15px;height:15px}

  .wrap-pad{padding:0 28px}
  .verified-line{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--t3);font-weight:500;margin-bottom:8px}
  .verified-line svg{width:13px;height:13px;color:var(--pl);flex-shrink:0}
  .profile-name{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
  .profile-tagline{font-size:16px;color:var(--t2);line-height:1.5;margin-bottom:24px;max-width:48ch;font-weight:400}

  .stat-row{display:flex;gap:10px;margin-bottom:28px}
  .stat{flex:1;background:var(--bg2);border-radius:16px;padding:16px 8px;text-align:center}
  .stat-val{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .stat-lbl{font-size:11px;color:var(--t3);margin-top:4px;font-weight:500}
  .stat-line{font-size:14px;color:var(--t3);margin-bottom:28px;font-weight:500}

  .profile-bio{font-size:16px;line-height:1.6;color:var(--t2);font-weight:400;margin-bottom:28px;max-width:56ch}

  .section-label{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:16px}

  .im-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .im-card{background:var(--bg2);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s ease}
  .im-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .im-card-img{height:150px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden;background:var(--bg3)}
  .im-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}
  .im-card-emoji{position:relative;z-index:1;opacity:.85}
  .im-card-status{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:2}
  .im-card-destaque{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:20px;background:rgba(245,158,11,.92);color:#1a1200;z-index:2}
  .im-card-body{padding:16px}
  .im-card-price{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  .im-card-addr{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
  .im-card-specs{display:flex;gap:12px;font-size:11.5px;color:var(--t2);font-weight:500}
  .im-card-specs span{display:flex;align-items:center;gap:4px}
  .im-card-specs svg{width:12px;height:12px;opacity:.6}

  .empty-imoveis{text-align:center;padding:56px 20px;color:var(--t3);font-size:14px;background:var(--bg2);border-radius:18px}

  footer{text-align:center;padding:24px;font-size:12.5px;color:var(--t3)}
  footer a{color:var(--t2);text-decoration:none;font-weight:600}

  /* CTA fixo — prático pro cliente não precisar rolar de volta */
  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(10,10,10,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;justify-content:center;
  }
  body.light-mode .sticky-cta{background:rgba(255,255,255,.82)}
  .sticky-cta a{
    width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#25d366;color:#fff;font-size:15px;font-weight:600;padding:14px;border-radius:14px;text-decoration:none;
  }
  .sticky-cta svg{width:19px;height:19px;flex-shrink:0}

  @media(max-width:600px){
    .banner{height:140px}
    .profile-name{font-size:27px}
    .stat-row{gap:8px}
  }
</style>
</head>
<body>

  <header>
    <a href="index.html">
      <img src="logo.svg" alt="Grupo Captar"/>
    </a>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Carregando perfil…</p>
      </div>
    </div>
  </main>

  <footer>
    Perfil de <a href="index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

<script>
const SUPABASE_URL = 'https://ntebllysafkushvhubos.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50ZWJsbHlzYWZrdXNodmh1Ym9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjUyNjEsImV4cCI6MjA5NDEwMTI2MX0.2Zxqc5oISDGWlSOhi6Zse0uVdY5pateMcMw9wLxYESY';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Tema claro/escuro — respeita a preferência do sistema por padrão, mas
// lembra a escolha manual do visitante (cliente do corretor) no navegador dele.
function toggleTheme(){
  const isLight=document.body.classList.toggle('light-mode');
  localStorage.setItem('captar_public_theme', isLight?'light':'dark');
  const btn=document.getElementById('theme-toggle-btn');
  if(btn)btn.textContent=isLight?'☀️':'🌙';
}
(function initTheme(){
  const saved=localStorage.getItem('captar_public_theme');
  const preferLight=saved?saved==='light':window.matchMedia('(prefers-color-scheme: light)').matches;
  if(preferLight){
    document.body.classList.add('light-mode');
    const btn=document.getElementById('theme-toggle-btn');
    if(btn)btn.textContent='☀️';
  }
})();

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

function fotoPublicUrl(bucket, path){
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}

function renderState(iconPath, msg){
  document.getElementById('content').innerHTML = `<div class="state-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${iconPath}</svg>
    <p>${escHtml(msg)}</p>
  </div>`;
}

const ICON_INSTAGRAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>';
const ICON_SITE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>';
const ICON_WHATSAPP = '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.027 7.77L0 32l8.43-2.007A15.934 15.934 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 01-6.77-1.848l-.485-.287-5.005 1.192 1.215-4.872-.317-.5A13.27 13.27 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.27-9.87c-.398-.199-2.356-1.163-2.72-1.295-.365-.133-.631-.199-.897.199-.265.398-1.03 1.295-1.263 1.56-.232.266-.465.299-.863.1-.398-.199-1.681-.62-3.203-1.977-1.184-1.057-1.983-2.362-2.215-2.76-.232-.398-.025-.613.174-.811.179-.178.398-.465.598-.698.199-.232.265-.398.398-.664.133-.265.066-.498-.033-.697-.1-.199-.897-2.163-1.23-2.96-.324-.778-.652-.673-.897-.685l-.764-.013c-.265 0-.697.1-1.063.498-.365.398-1.396 1.363-1.396 3.327s1.43 3.86 1.63 4.126c.198.265 2.814 4.297 6.82 6.026.954.412 1.698.658 2.279.842.957.305 1.829.262 2.517.159.768-.115 2.356-.963 2.688-1.894.332-.93.332-1.728.232-1.894-.099-.166-.365-.265-.763-.464z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>';

function instagramUrl(handle){
  handle=String(handle||'').trim();
  if(!handle)return'';
  if(/^https?:\/\//i.test(handle))return handle;
  return `https://instagram.com/${handle.replace(/^@/,'')}`;
}
function siteUrl(url){
  url=String(url||'').trim();
  if(!url)return'';
  return /^https?:\/\//i.test(url)?url:`https://${url}`;
}

async function load(){
  const params = new URLSearchParams(location.search);
  // O rewrite do Vercel (/c/:slug -> /corretor-publico.html?u=:slug) é
  // invisível pro JS do navegador: location.search continua vazio, o
  // slug só aparece em location.pathname. Por isso o ?u= no destino do
  // rewrite serve só de documentação — na prática precisamos ler o path.
  const pathMatch = location.pathname.match(/\/c\/([^/]+)\/?$/);
  const slug = params.get('u') || (pathMatch ? decodeURIComponent(pathMatch[1]) : '');
  let id = params.get('id');
  if(!slug && !id){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do corretor.');
    return;
  }

  // Aceita tanto o link antigo (?id=uuid) quanto o novo, com o nome do
  // corretor no link (?u=slug, ou /c/slug via rewrite do Vercel).
  const query = slug
    ? _sb.from('perfil_publico').select('*').eq('slug', slug)
    : _sb.from('perfil_publico').select('*').eq('user_id', id);
  const {data: perfil, error} = await query.eq('ativo', true).maybeSingle();
  if(perfil)id = perfil.user_id;

  if(error || !perfil){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Esse perfil não está disponível publicamente, ou o link está incorreto.');
    return;
  }

  document.title = `${perfil.nome || 'Corretor'} — Grupo Captar`;

  if(perfil.cor_destaque){
    document.documentElement.style.setProperty('--pl', perfil.cor_destaque);
    document.documentElement.style.setProperty('--p', perfil.cor_destaque);
  }

  const {data: imoveisData} = await _sb.from('imoveis').select('*').eq('user_id', id).eq('publico', true).order('created_at', { ascending: false });
  // Imóveis marcados como destaque pelo corretor aparecem primeiro —
  // sort estável, então dentro de cada grupo (destaque / não-destaque)
  // a ordem por data mais recente já vinda do banco é preservada.
  const lista = (imoveisData || []).slice().sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0));

  const logoUrl = fotoPublicUrl('logos', `${id}/avatar.jpg`);
  const capaUrl = perfil.capa_path ? fotoPublicUrl('logos', `${id}/capa.jpg`) : '';
  const waPhone = waPhoneBR(perfil.tel || '');
  const waText = encodeURIComponent(`Olá! Vi seu perfil no Grupo Captar e quero saber mais sobre seus imóveis.`);
  const igUrl = instagramUrl(perfil.instagram);
  const siteHref = siteUrl(perfil.site_url);

  document.getElementById('content').innerHTML = `
    <div class="banner">
      ${capaUrl ? `<img src="${escHtml(capaUrl)}" alt="" onerror="this.remove()"/>` : ''}
    </div>
    <div class="profile-head fade-up">
      <div class="profile-avatar-row">
        <img class="profile-logo" src="${escHtml(logoUrl)}" data-fallback-initials="${escHtml(initialsOf(perfil.nome))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'profile-avatar-fallback',textContent:this.dataset.fallbackInitials}))"/>
        ${(igUrl || siteHref) ? `
        <div class="profile-social">
          ${igUrl ? `<a href="${escHtml(igUrl)}" target="_blank" rel="noopener noreferrer" title="Instagram">${ICON_INSTAGRAM}</a>` : ''}
          ${siteHref ? `<a href="${escHtml(siteHref)}" target="_blank" rel="noopener noreferrer" title="Site">${ICON_SITE}</a>` : ''}
        </div>` : ''}
      </div>
    </div>
    <div class="wrap-pad">
      <div class="fade-up d1">
        <div class="verified-line">${ICON_CHECK} Corretor parceiro Grupo Captar</div>
        <div class="profile-name">${escHtml(perfil.nome || 'Corretor')}</div>
        ${perfil.tagline ? `<p class="profile-tagline">${escHtml(perfil.tagline)}</p>` : ''}
      </div>

      ${(perfil.creci || perfil.especialidade) ? `
      <div class="stat-row fade-up d2">
        <div class="stat"><div class="stat-val">${lista.length}</div><div class="stat-lbl">Imóve${lista.length===1?'l':'is'}</div></div>
        ${perfil.creci ? `<div class="stat"><div class="stat-val">${escHtml(perfil.creci)}</div><div class="stat-lbl">CRECI</div></div>` : ''}
        ${perfil.especialidade ? `<div class="stat"><div class="stat-val" style="font-size:13px;line-height:1.4;padding-top:2px">${escHtml(perfil.especialidade)}</div><div class="stat-lbl">Especialidade</div></div>` : ''}
      </div>
      ` : `<div class="stat-line fade-up d2">${lista.length} imóve${lista.length===1?'l':'is'} disponíve${lista.length===1?'l':'is'} publicamente</div>`}

      ${perfil.bio ? `<p class="profile-bio fade-up d2" style="margin-bottom:36px">${escHtml(perfil.bio)}</p>` : ''}

      <div class="section-label">Imóveis disponíveis${lista.length ? ' · ' + lista.length : ''}</div>
      ${lista.length ? `
        <div class="im-grid fade-up d3">
          ${lista.map(im => {
            const areaParts=[im.quartos>0?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V12h18v10M2 12V8a2 2 0 012-2h16a2 2 0 012 2v4"/></svg>${escHtml(String(im.quartos))} qts</span>`:'', formatAreaValor(String(im.area||'').split(' / ')[0])?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>${escHtml(formatAreaValor(String(im.area||'').split(' / ')[0]))}</span>`:''].filter(Boolean).join('');
            return `
            <a class="im-card" href="imovel-publico.html?id=${encodeURIComponent(im.id)}">
              <div class="im-card-img">
                ${im.status ? `<span class="im-card-status">${escHtml(im.status)}</span>` : ''}
                ${im.destaque ? `<span class="im-card-destaque">⭐ Destaque</span>` : ''}
                ${Array.isArray(im.fotos) && im.fotos.length
                  ? `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" data-fallback-emoji="${escHtml(im.emoji||'🏠')}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'im-card-emoji',textContent:this.dataset.fallbackEmoji}))"/>`
                  : `<span class="im-card-emoji">${escHtml(im.emoji || '🏠')}</span>`}
              </div>
              <div class="im-card-body">
                <div class="im-card-price">${escHtml(im.preco || 'Sob consulta')}</div>
                <div class="im-card-addr">${escHtml(im.endereco || '—')}</div>
                ${areaParts ? `<div class="im-card-specs">${areaParts}</div>` : ''}
              </div>
            </a>
          `}).join('')}
        </div>
      ` : `<div class="empty-imoveis">Nenhum imóvel compartilhado publicamente no momento.</div>`}
    </div>
  `;

  if(waPhone){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="sticky-cta">
        <a href="https://wa.me/${waPhone}?text=${waText}" target="_blank" rel="noopener noreferrer">${ICON_WHATSAPP} Falar no WhatsApp</a>
      </div>
    `);
  }
}

load();
</script>
</body>
</html>
