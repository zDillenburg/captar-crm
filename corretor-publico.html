<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Corretor — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --p:#850277;--pl:#a3039a;--pd:#620158;
    --bg:#0f0d0b;--bg2:#161310;--bg3:#1c1916;--bg4:#221e1b;
    --border:rgba(255,255,255,0.08);
    --t1:#fffdea;--t2:rgba(255,253,234,.65);--t3:#8a8070;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  header{display:flex;align-items:center;justify-content:center;padding:20px;border-bottom:1px solid var(--border)}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:32px;width:auto}
  main{flex:1;display:flex;justify-content:center;padding:32px 16px 64px}
  .wrap{width:100%;max-width:760px}

  .state-box{text-align:center;padding:80px 20px;color:var(--t3)}
  .state-box svg{width:40px;height:40px;margin-bottom:16px;opacity:.5}
  .state-box p{font-size:14px;line-height:1.7}

  .profile-card{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .profile-logo{width:72px;height:72px;border-radius:16px;object-fit:contain;background:#fff;flex-shrink:0}
  .profile-avatar-fallback{width:72px;height:72px;border-radius:16px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0}
  .profile-info{flex:1;min-width:200px}
  .profile-name{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
  .profile-meta{font-size:12.5px;color:var(--t3);margin-bottom:10px}
  .profile-bio{font-size:13.5px;color:var(--t2);line-height:1.65;max-width:520px;margin-bottom:16px}

  .profile-cta{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:#25d366;color:#fff;font-size:14px;font-weight:700;
    padding:12px 20px;border-radius:12px;text-decoration:none;
  }
  .profile-cta svg{width:18px;height:18px;flex-shrink:0}

  .section-label{font-size:11px;font-weight:800;color:var(--pl);text-transform:uppercase;letter-spacing:.06em;margin:32px 0 14px}

  .im-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .im-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .15s ease,border-color .15s ease}
  .im-card:hover{transform:translateY(-2px);border-color:var(--pl)}
  .im-card-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden}
  .im-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .im-card-status{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:1}
  .im-card-body{padding:12px 14px}
  .im-card-price{font-size:15px;font-weight:800;margin-bottom:2px}
  .im-card-addr{font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty-imoveis{text-align:center;padding:40px 20px;color:var(--t3);font-size:13px;background:var(--bg2);border:1px solid var(--border);border-radius:14px}

  footer{text-align:center;padding:22px;border-top:1px solid var(--border);font-size:12px;color:var(--t3)}
  footer a{color:var(--pl);text-decoration:none;font-weight:700}

  @media(max-width:480px){
    .profile-card{flex-direction:column;align-items:center;text-align:center}
    .profile-info{min-width:0;width:100%}
    .profile-bio{max-width:none}
  }
</style>
</head>
<body>

  <header>
    <a href="index.html">
      <img src="logo.svg" alt="Grupo Captar"/>
    </a>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Carregando perfil…</p>
      </div>
    </div>
  </main>

  <footer>
    Perfil de <a href="index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

<script>
const SUPABASE_URL = 'https://ntebllysafkushvhubos.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50ZWJsbHlzYWZrdXNodmh1Ym9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjUyNjEsImV4cCI6MjA5NDEwMTI2MX0.2Zxqc5oISDGWlSOhi6Zse0uVdY5pateMcMw9wLxYESY';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

function fotoPublicUrl(bucket, path){
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

function renderState(iconPath, msg){
  document.getElementById('content').innerHTML = `<div class="state-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${iconPath}</svg>
    <p>${escHtml(msg)}</p>
  </div>`;
}

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do corretor.');
    return;
  }

  const {data: perfil, error} = await _sb.from('perfil_publico').select('*').eq('user_id', id).eq('ativo', true).maybeSingle();

  if(error || !perfil){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Esse perfil não está disponível publicamente, ou o link está incorreto.');
    return;
  }

  document.title = `${perfil.nome || 'Corretor'} — Grupo Captar`;

  if(perfil.cor_destaque){
    document.documentElement.style.setProperty('--pl', perfil.cor_destaque);
    document.documentElement.style.setProperty('--p', perfil.cor_destaque);
  }

  const {data: imoveisData} = await _sb.from('imoveis').select('*').eq('user_id', id).eq('publico', true).order('created_at', { ascending: false });
  const lista = imoveisData || [];

  const logoUrl = fotoPublicUrl('logos', `${id}/logo.jpg`);
  const waPhone = waPhoneBR(perfil.tel || '');
  const waText = encodeURIComponent(`Olá! Vi seu perfil no Grupo Captar e quero saber mais sobre seus imóveis.`);
  const metaLine = [perfil.especialidade, perfil.creci ? 'CRECI ' + perfil.creci : ''].filter(Boolean).map(escHtml).join(' · ');

  document.getElementById('content').innerHTML = `
    <div class="profile-card">
      <img class="profile-logo" src="${escHtml(logoUrl)}" data-fallback-initials="${escHtml(initialsOf(perfil.nome))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'profile-avatar-fallback',textContent:this.dataset.fallbackInitials}))"/>
      <div class="profile-info">
        <div class="profile-name">${escHtml(perfil.nome || 'Corretor')}</div>
        ${metaLine ? `<div class="profile-meta">${metaLine}</div>` : ''}
        ${perfil.bio ? `<p class="profile-bio">${escHtml(perfil.bio)}</p>` : ''}
        ${waPhone ? `
        <a class="profile-cta" href="https://wa.me/${waPhone}?text=${waText}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.027 7.77L0 32l8.43-2.007A15.934 15.934 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 01-6.77-1.848l-.485-.287-5.005 1.192 1.215-4.872-.317-.5A13.27 13.27 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.27-9.87c-.398-.199-2.356-1.163-2.72-1.295-.365-.133-.631-.199-.897.199-.265.398-1.03 1.295-1.263 1.56-.232.266-.465.299-.863.1-.398-.199-1.681-.62-3.203-1.977-1.184-1.057-1.983-2.362-2.215-2.76-.232-.398-.025-.613.174-.811.179-.178.398-.465.598-.698.199-.232.265-.398.398-.664.133-.265.066-.498-.033-.697-.1-.199-.897-2.163-1.23-2.96-.324-.778-.652-.673-.897-.685l-.764-.013c-.265 0-.697.1-1.063.498-.365.398-1.396 1.363-1.396 3.327s1.43 3.86 1.63 4.126c.198.265 2.814 4.297 6.82 6.026.954.412 1.698.658 2.279.842.957.305 1.829.262 2.517.159.768-.115 2.356-.963 2.688-1.894.332-.93.332-1.728.232-1.894-.099-.166-.365-.265-.763-.464z"/></svg>
          Falar no WhatsApp
        </a>
        ` : ''}
      </div>
    </div>

    <div class="section-label">Imóveis disponíveis${lista.length ? ' (' + lista.length + ')' : ''}</div>
    ${lista.length ? `
      <div class="im-grid">
        ${lista.map(im => `
          <a class="im-card" href="imovel-publico.html?id=${encodeURIComponent(im.id)}">
            <div class="im-card-img" style="background:${escHtml(im.grad || 'linear-gradient(135deg,#1e3a5f,#1e40af)')}">
              ${im.status ? `<span class="im-card-status">${escHtml(im.status)}</span>` : ''}
              ${escHtml(im.emoji || '🏠')}
              ${Array.isArray(im.fotos) && im.fotos.length ? `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" onerror="this.remove()"/>` : ''}
            </div>
            <div class="im-card-body">
              <div class="im-card-price">${escHtml(im.preco || 'Sob consulta')}</div>
              <div class="im-card-addr">${escHtml(im.endereco || '—')}</div>
            </div>
          </a>
        `).join('')}
      </div>
    ` : `<div class="empty-imoveis">Nenhum imóvel compartilhado publicamente no momento.</div>`}
  `;
}

load();
</script>
</body>
</html>
