<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Corretor — Grupo Captar</title>
<meta property="og:type" content="profile"/>
<meta property="og:site_name" content="Grupo Captar"/>
<meta property="og:title" content="Corretor — Grupo Captar"/>
<meta property="og:description" content="Corretor parceiro Grupo Captar — veja os imóveis disponíveis."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --purple:#850277;--purple-light:#a3039a;--purple-dark:#620158;
    --black:#100e0d;--ink:#0a0908;--base:#100e0d;--surface:#17140f;--surface-2:#1d1916;
    --line:rgba(255,253,234,.085);--line-mid:rgba(255,253,234,.14);--line-strong:rgba(255,253,234,.22);
    --t-100:#fffdea;--t-70:rgba(255,253,234,.70);--t-55:rgba(255,253,234,.55);--t-40:rgba(255,253,234,.52);--t-28:rgba(255,253,234,.46);
    --r-xs:6px;--r-sm:10px;--r:14px;--r-lg:22px;
    --ease:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.4,0,.2,1);
  }
  body.light-mode{
    --black:#fffdea;--ink:#fffdea;--base:#fffdea;--surface:#f5f3e4;--surface-2:#ece9d5;
    --line:rgba(16,14,13,.08);--line-mid:rgba(16,14,13,.14);--line-strong:rgba(16,14,13,.24);
    --t-100:#100e0d;--t-70:rgba(16,14,13,.72);--t-55:rgba(16,14,13,.56);--t-40:rgba(16,14,13,.48);--t-28:rgba(16,14,13,.40);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--base);color:var(--t-100);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background .25s ease,color .25s ease}
  a{color:inherit}
  ::selection{background:var(--purple-light);color:#fff}

  header{display:flex;align-items:center;justify-content:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--base) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:24px;width:auto;opacity:.92}
  body.light-mode header img{filter:brightness(0) saturate(0);opacity:.82}
  .header-brand-sep{color:var(--t-40);font-weight:300;font-size:15px}
  .header-brand-name{font-size:13px;font-weight:700;color:var(--t-55);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  .theme-toggle{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t-70);transition:background .2s ease,transform .2s var(--ease);
  }
  .theme-toggle:hover{background:var(--surface-2);transform:translateY(-50%) scale(1.06)}
  main{flex:1;display:flex;justify-content:center}
  .wrap{width:100%;max-width:680px;padding-bottom:130px}

  @media(prefers-reduced-motion:no-preference){
    /* SEM opacity aqui de propósito — uma versão anterior desse padrão
       (opacity:0 + animação com fill-mode forwards) podia deixar a
       página inteira invisível pra sempre se a animação nunca
       terminasse de verdade (aba em segundo plano, navegador suspendendo
       a animação). Só animar `transform` garante que o conteúdo esteja
       sempre visível desde o primeiro frame, não importa o que aconteça
       com a animação. */
    .fade-up{transform:translateY(14px);animation:fadeUp .6s var(--ease) forwards}
    .fade-up.d1{animation-delay:.06s}
    .fade-up.d2{animation-delay:.12s}
    .fade-up.d3{animation-delay:.18s}
    .fade-up.d4{animation-delay:.24s}
    @keyframes fadeUp{to{transform:translateY(0)}}
    .card-in{transform:translateY(16px) scale(.98);animation:cardIn .55s var(--ease) forwards;animation-delay:calc(var(--i, 0) * 45ms)}
    @keyframes cardIn{to{transform:translateY(0) scale(1)}}
  }
  @media(prefers-reduced-motion:reduce){
    .fade-up,.card-in{opacity:1!important;transform:none!important;animation:none!important}
  }

  .state-box{text-align:center;padding:120px 20px;color:var(--t-40);max-width:380px;margin:0 auto}
  .state-box svg{width:32px;height:32px;margin-bottom:20px;opacity:.5}
  .state-box p{font-size:15px;line-height:1.6}

  /* ── Skeleton de carregamento — já sugere o layout final ── */
  .skel{background:linear-gradient(90deg, var(--surface) 22%, var(--surface-2) 40%, var(--surface) 58%);background-size:400% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--r)}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-20% 0}}
  .skel-wrap{padding-bottom:60px}
  .skel-banner{height:180px;border-radius:0}
  .skel-head{padding:0 28px;margin-top:-40px;position:relative}
  .skel-avatar{width:88px;height:88px;border-radius:22px;border:3px solid var(--base)}
  .skel-pad{padding:24px 28px 0}
  .skel-line{height:14px;margin-bottom:10px}
  .skel-stats{display:flex;gap:10px;padding:0 28px;margin:24px 0}
  .skel-stat{flex:1;height:64px;border-radius:16px}
  .skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 28px}
  .skel-card{height:230px}
  @media(prefers-reduced-motion:reduce){.skel{animation:none;background:var(--surface)}}

  /* ── Banner + avatar ─────────────────────────────── */
  .banner{height:190px;background:var(--surface);position:relative;overflow:hidden}
  .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--base) 100%);opacity:.85}
  .banner img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
  .profile-head{padding:0 28px;margin-top:-44px;position:relative;z-index:2}
  .profile-avatar-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
  .profile-logo,.profile-avatar-fallback{width:88px;height:88px;border-radius:22px;flex-shrink:0;border:3px solid var(--base);box-shadow:0 16px 32px -8px rgba(0,0,0,.55)}
  .profile-logo{object-fit:contain;background:#fff}
  .profile-avatar-fallback{background:linear-gradient(160deg,var(--purple-light),var(--purple-dark));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
  .profile-social{display:flex;gap:8px;margin-bottom:4px}
  .profile-social a,.profile-social button{
    width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--t-70);transition:background .18s,color .18s,transform .18s var(--ease);
    cursor:pointer;font:inherit;
  }
  .profile-social a:hover,.profile-social button:hover{background:var(--purple);color:#fff;transform:translateY(-2px)}
  .profile-social svg{width:15px;height:15px}

  .wrap-pad{padding:0 28px}
  .verified-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t-40);font-weight:600;margin-bottom:9px;letter-spacing:.01em}
  .resposta-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:20px;padding:5px 11px;margin-bottom:14px}
  .verified-line svg{width:13px;height:13px;color:var(--purple-light);flex-shrink:0}
  .profile-name{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:9px}
  .profile-tagline{font-size:16px;color:var(--t-70);line-height:1.55;margin-bottom:24px;max-width:48ch;font-weight:500;overflow-wrap:anywhere;word-break:break-word}

  .stat-row{display:flex;gap:10px;margin-bottom:28px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;transition:background .2s,border-color .2s}
  .stat-val{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--t-100)}
  .stat-lbl{font-size:11px;color:var(--t-40);margin-top:4px;font-weight:600;letter-spacing:.02em}
  .stat-line{font-size:14px;color:var(--t-40);margin-bottom:28px;font-weight:600}

  .profile-bio{font-size:16px;line-height:1.65;color:var(--t-70);font-weight:500;margin-bottom:28px;max-width:56ch;overflow-wrap:anywhere;word-break:break-word}

  .section-label{font-size:13px;font-weight:700;color:var(--t-40);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .section-label-count{font-weight:600;color:var(--t-28)}

  /* ── Barra de busca + filtro ─────────────────────── */
  .search-row{display:flex;gap:8px;margin-bottom:16px}
  .search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;transition:border-color .2s}
  .search-box:focus-within{border-color:var(--purple-light)}
  .search-box svg{width:16px;height:16px;color:var(--t-40);flex-shrink:0}
  .search-box input{flex:1;background:none;border:none;outline:none;color:var(--t-100);font:inherit;font-size:14.5px;padding:12px 0;font-family:'Manrope',sans-serif}
  .search-box input::placeholder{color:var(--t-28)}
  .filter-toggle{
    position:relative;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:0 16px;color:var(--t-70);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .2s,color .2s;flex-shrink:0;font-family:inherit;
  }
  .filter-toggle svg{width:15px;height:15px}
  .filter-toggle.active{border-color:var(--purple-light);color:var(--t-100)}
  .filter-toggle-badge{
    position:absolute;top:-6px;right:-6px;background:var(--purple-light);color:#fff;font-size:10px;font-weight:800;
    width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }

  .filter-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:39;opacity:0;visibility:hidden;transition:opacity .25s ease}
  .filter-backdrop.open{opacity:1;visibility:visible}
  .filter-panel{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;z-index:40;
    background:var(--surface);border:1px solid var(--line-mid);border-bottom:none;border-radius:22px 22px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom));transition:transform .35s var(--ease);
    max-height:80vh;overflow-y:auto;box-shadow:0 -24px 60px -20px rgba(0,0,0,.6);
  }
  .filter-panel.open{transform:translate(-50%,0)}
  .filter-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .filter-panel-head h3{font-size:16px;font-weight:800}
  .filter-panel-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:none;color:var(--t-70);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .filter-field{margin-bottom:16px}
  .filter-field label{display:block;font-size:12px;font-weight:700;color:var(--t-40);letter-spacing:.02em;margin-bottom:8px}
  .filter-field select,.filter-field input{
    width:100%;background:var(--surface-2);border:1px solid var(--line-mid);border-radius:var(--r-sm);color:var(--t-100);
    font:inherit;font-size:14.5px;padding:11px 12px;outline:none;transition:border-color .2s;font-family:'Manrope',sans-serif;
  }
  .filter-field select:focus,.filter-field input:focus{border-color:var(--purple-light)}
  .filter-field-row{display:flex;gap:10px}
  .filter-field-row .filter-field{flex:1;margin-bottom:0}
  .filter-divider{height:1px;background:var(--line);margin:4px 0 16px}
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px}
  .filter-chip{
    background:var(--surface-2);border:1px solid var(--line-mid);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;
    color:var(--t-55);cursor:pointer;transition:background .18s,border-color .18s,color .18s;font-family:inherit;
  }
  .filter-chip.active{background:var(--purple);border-color:var(--purple);color:#fff}
  .filter-actions{display:flex;gap:10px;margin-top:20px}
  .filter-clear{flex:1;background:none;border:1px solid var(--line-mid);border-radius:var(--r-sm);color:var(--t-55);font:inherit;font-weight:700;font-size:14px;padding:13px;cursor:pointer;transition:border-color .18s,color .18s}
  .filter-clear:hover{border-color:var(--line-strong);color:var(--t-100)}
  .filter-apply{flex:1;background:var(--purple);border:none;border-radius:var(--r-sm);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:13px;cursor:pointer;transition:background .18s}
  .filter-apply:hover{background:var(--purple-light)}

  .mini-ctas-row{display:flex;gap:10px;margin:8px 0 28px}
  @media(max-width:520px){.mini-ctas-row{flex-direction:column}}
  .vender-cta{
    display:flex;align-items:center;gap:10px;background:var(--surface);flex:1;min-width:0;
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;
    cursor:pointer;font-family:inherit;transition:border-color .2s,background .2s;
  }
  .vender-cta:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .vender-cta-icon{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vender-cta-icon svg{width:15px;height:15px;color:var(--t-55)}
  .vender-cta-title{font-size:12.5px;font-weight:700;color:var(--t-70);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vender-cta-sub{font-size:11.5px;color:var(--t-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── Tabs Venda/Locação ─────────────────── */
  .finalidade-tabs{display:flex;gap:8px;margin-bottom:16px}
  .finalidade-tab{background:var(--surface);border:1px solid var(--line);color:var(--t-55);font:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:20px;cursor:pointer;transition:border-color .18s,background .18s,color .18s}
  .finalidade-tab:hover{border-color:var(--line-strong)}
  .finalidade-tab.active{background:var(--purple);border-color:var(--purple);color:#fff}
  .vender-feedback{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:10px;display:none}
  .vender-feedback.ok{display:block;background:rgba(34,197,94,.12);color:#4ade80}
  .vender-feedback.err{display:block;background:rgba(239,68,68,.12);color:#f87171}

  .vendidos-section{margin-bottom:28px}
  .vendidos-title{font-size:13px;font-weight:800;color:var(--t-70);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .vendidos-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .vendido-card{flex:0 0 auto;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .vendido-card-img{height:90px;position:relative;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:22px}
  .vendido-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .vendido-tag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 7px;border-radius:20px;background:rgba(34,197,94,.92);color:#0a1f0f;z-index:1}
  .vendido-card-body{padding:10px 12px}
  .vendido-card-price{font-size:12.5px;font-weight:800;color:var(--t-100)}
  .vendido-card-addr{font-size:10.5px;color:var(--t-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  .loteamentos-section{margin-bottom:28px}
  .loteamentos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .loteamento-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s var(--ease)}
  a.loteamento-card:hover{border-color:var(--purple-light);transform:translateY(-2px)}
  .loteamento-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .loteamento-tipo{font-size:11px;font-weight:700;color:var(--t-40)}
  .loteamento-status{font-size:10.5px;font-weight:700;color:var(--t-55);background:var(--surface-2);padding:3px 8px;border-radius:20px}
  .loteamento-nome{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
  .loteamento-local{font-size:12px;color:var(--t-40);margin-bottom:4px}
  .loteamento-preco{font-size:13.5px;font-weight:800;color:var(--purple-light);margin-bottom:2px}
  .loteamento-disp{font-size:11.5px;color:var(--t-55);font-weight:600}

  /* ── Favoritos ───────────────────────────── */
  .favoritos-fab{
    position:fixed;right:16px;z-index:19;display:none;align-items:center;gap:7px;
    background:var(--purple);color:#fff;border:none;border-radius:999px;
    padding:12px 16px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.4);transition:transform .18s var(--ease),filter .18s;
  }
  .favoritos-fab.show{display:flex}
  .favoritos-fab:hover{filter:brightness(1.08)}
  .favoritos-fab:active{transform:scale(.96)}
  .favoritos-fab svg{width:16px;height:16px}
  .favorito-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface-2);border-radius:14px;margin-bottom:10px}
  .favorito-item-img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--surface)}
  .favorito-item-body{flex:1;min-width:0}
  .favorito-item-price{font-size:13px;font-weight:800}
  .favorito-item-addr{font-size:11.5px;color:var(--t-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .favorito-item-remove{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line-mid);color:var(--t-55);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .favoritos-empty{font-size:13px;color:var(--t-40);text-align:center;padding:24px 0}
  .favoritos-compare-toggle{background:var(--surface-2);border:1px solid var(--line-mid);border-radius:20px;padding:7px 13px;font:inherit;font-size:12px;font-weight:700;color:var(--t-70);cursor:pointer;transition:border-color .18s,color .18s}
  .favoritos-compare-toggle:hover{border-color:var(--purple-light);color:var(--t-100)}
  .comparador-wrap{overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch}
  .comparador-table{border-collapse:collapse;width:100%}
  .comparador-table td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--t-70)}
  .comparador-table td:first-child{color:var(--t-40);font-weight:700;position:sticky;left:0;background:var(--surface-2);z-index:1}
  .comp-img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
  .comp-price{font-weight:800;color:var(--t-100)}

  .depoimentos-section{margin-top:36px}
  .depoimentos-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .depoimentos-title{font-size:13px;font-weight:800;color:var(--t-70);text-transform:uppercase;letter-spacing:.05em}
  .depoimento-add-btn{background:var(--surface-2);border:1px solid var(--line-mid);border-radius:20px;padding:7px 14px;font:inherit;font-size:12px;font-weight:700;color:var(--t-70);cursor:pointer;transition:border-color .18s,color .18s}
  .depoimento-add-btn:hover{border-color:var(--purple-light);color:var(--t-100)}
  .depoimento-stars-picker{display:flex;gap:6px;margin-bottom:14px}
  .depoimento-star{font-size:26px;cursor:pointer;color:var(--line-strong);background:none;border:none;padding:0;line-height:1;transition:transform .15s var(--ease)}
  .depoimento-star.on{color:#f59e0b}
  .depoimento-star:hover{transform:scale(1.15)}
  .depoimentos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}

// im.preco é texto livre (ex: "R$ 850.000") — parseia pra número em reais
// pra permitir filtro por faixa de preço, sem exigir mudança de schema.
function parseMoneyBR(v){
  if(v==null)return null;
  const s=String(v).replace(/[^\d.,]/g,'').trim();
  if(!s)return null;
  let n;
  if(s.includes('.')&&s.includes(',')) n=parseFloat(s.replace(/\./g,'').replace(',','.'));
  else if(s.includes(',')) n=parseFloat(s.replace(',','.'));
  else n=parseInt(s.replace(/\./g,''),10);
  return Number.isFinite(n)?n:null;
}

function uniqueSorted(arr){
  return Array.from(new Set(arr.filter(Boolean).map(v=>String(v).trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function instagramUrl(handle){
  handle=String(handle||'').trim();
  if(!handle)return'';
  if(/^https?:\/\//i.test(handle))return handle;
  return `https://instagram.com/${handle.replace(/^@/,'')}`;
}
function siteUrl(url){
  url=String(url||'').trim();
  if(!url)return'';
  return /^https?:\/\//i.test(url)?url:`https://${url}`;
}

// ── estado do filtro/busca — tudo client-side, a lista inteira já está em memória ──
let _lista = [];
let _filters = { q:'', tipo:'', cidade:'', quartosMin:0, banheirosMin:0, precoMin:null, precoMax:null, finalidade:'', ordenar:'' };
let _venderUserId = null;

// endereco vem sempre como "bairro — cidade — UF" (com algum segmento
// podendo faltar) — a cidade é sempre o penúltimo pedaço, então esse
// heurístico funciona mesmo quando o bairro não foi preenchido.
function cidadeFromEndereco(endereco){
  const parts = String(endereco||'').split(' — ').map(p=>p.trim()).filter(Boolean);
  return parts.length >= 2 ? parts[parts.length - 2] : '';
}

function matchesFilters(im){
  if(_filters.finalidade && (im.finalidade==='aluguel'?'aluguel':'venda') !== _filters.finalidade) return false;
  if(_filters.tipo && String(im.tipo||'').trim() !== _filters.tipo) return false;
  if(_filters.cidade && cidadeFromEndereco(im.endereco) !== _filters.cidade) return false;
  if(_filters.quartosMin && Number(im.quartos||0) < _filters.quartosMin) return false;
  if(_filters.banheirosMin && Number(im.banheiros||0) < _filters.banheirosMin) return false;
  if(_filters.precoMin!=null || _filters.precoMax!=null){
    const p = parseMoneyBR(im.preco);
    if(p==null) return false;
    if(_filters.precoMin!=null && p < _filters.precoMin) return false;
    if(_filters.precoMax!=null && p > _filters.precoMax) return false;
  }
  if(_filters.q){
    const hay = `${im.endereco||''} ${im.titulo||''} ${im.tipo||''}`.toLowerCase();
    if(!hay.includes(_filters.q.toLowerCase())) return false;
  }
  return true;
}

function activeFilterCount(){
  let n=0;
  if(_filters.tipo)n++;
  if(_filters.cidade)n++;
  if(_filters.quartosMin)n++;
  if(_filters.banheirosMin)n++;
  if(_filters.precoMin!=null||_filters.precoMax!=null)n++;
  return n;
}

function imCardHtml(im, i){
  const areaParts=[
    im.quartos>0?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V12h18v10M2 12V8a2 2 0 012-2h16a2 2 0 012 2v4"/></svg>${escHtml(String(im.quartos))} qts</span>`:'',
    formatAreaValor(String(im.area||'').split(' / ')[0])?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>${escHtml(formatAreaValor(String(im.area||'').split(' / ')[0]))}</span>`:''
  ].filter(Boolean).join('');
  const jaCurtiu = localStorage.getItem('captar_curtiu_' + im.id) === '1';
  return `

          ? `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" loading="lazy" data-fallback-emoji="${escHtml(im.emoji||'🏠')}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'im-card-emoji',textContent:this.dataset.fallbackEmoji}))"/>`
          : `<span class="im-card-emoji">${escHtml(im.emoji || '🏠')}</span>`}
        <button type="button" class="im-card-like ${jaCurtiu ? 'liked' : ''}" onclick="event.preventDefault();event.stopPropagation();curtirImovelCard('${escHtml(String(im.id))}',this)" ${jaCurtiu ? 'disabled' : ''}>${ICON_HEART}<span>${Number(im.curtidas || 0)}</span></button>
      </div>
      <div class="im-card-body">
        <div class="im-card-price">${escHtml(im.preco || 'Sob consulta')}</div>
        <div class="im-card-addr">${escHtml(im.endereco || '—')}</div>
        ${areaParts ? `<div class="im-card-specs">${areaParts}</div>` : ''}
      </div>
    </a>
  `;
}

function renderGrid(){
  const grid = document.getElementById('im-grid');
  // O container pode estar como grade (#im-grid) ou como estado vazio
  // (#im-grid-empty) dependendo do filtro anterior — sempre pegar o que
  // existir agora, senão uma mudança de filtro a partir do estado vazio
  // não teria nenhum elemento pra substituir e ficaria travada sem atualizar.
  const current = grid || document.getElementById('im-grid-empty');
  const countEl = document.getElementById('result-count');
  if(!current) return;
  const filtered = _lista.filter(matchesFilters);
  if(_filters.ordenar==='menor-preco') filtered.sort((a,b)=>(parseMoneyBR(a.preco)??Infinity)-(parseMoneyBR(b.preco)??Infinity));
  else if(_filters.ordenar==='maior-preco') filtered.sort((a,b)=>(parseMoneyBR(b.preco)??-Infinity)-(parseMoneyBR(a.preco)??-Infinity));
  const hasActiveFilter = activeFilterCount() > 0 || !!_filters.q;
  if(countEl) countEl.textContent = hasActiveFilter ? `${filtered.length} de ${_lista.length}` : `${_lista.length}`;

  if(!filtered.length){
    current.outerHTML = `<div class="empty-imoveis" id="im-grid-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON_EMPTY}</svg>
      ${_lista.length ? 'Nenhum imóvel encontrado com esses filtros.' : 'Nenhum imóvel compartilhado publicamente no momento.'}
      ${_lista.length && hasActiveFilter ? `<div><button class="empty-clear-btn" onclick="clearAllFilters()">Limpar filtros</button></div>` : ''}
    </div>`;
    return;
  }
  current.outerHTML = `<div class="im-grid" id="im-grid">${filtered.map((im,i)=>imCardHtml(im,i)).join('')}</div>`;
}

function onFilterChange(){
  const tipoEl = document.getElementById('f-tipo');
  const cidadeEl = document.getElementById('f-cidade');
  const minEl = document.getElementById('f-preco-min');
  const maxEl = document.getElementById('f-preco-max');
  const ordenarEl = document.getElementById('f-ordenar');
  _filters.tipo = tipoEl ? tipoEl.value : '';
  _filters.cidade = cidadeEl ? cidadeEl.value : '';
  _filters.precoMin = minEl && minEl.value ? Number(minEl.value) : null;
  _filters.precoMax = maxEl && maxEl.value ? Number(maxEl.value) : null;
  _filters.ordenar = ordenarEl ? ordenarEl.value : '';
  updateFilterChipsUI();
  updateFilterToggleUI();
  renderGrid();
}

function setFinalidade(val){
  _filters.finalidade = val;
  document.querySelectorAll('.finalidade-tab').forEach(tab=>{
    tab.classList.toggle('active', tab.dataset.val === val);
  });
  renderGrid();
}

function setQuartosMin(n){
  _filters.quartosMin = _filters.quartosMin === n ? 0 : n;
  updateFilterChipsUI();
  updateFilterToggleUI();
  renderGrid();
}

function setBanheirosMin(n){
  _filters.banheirosMin = _filters.banheirosMin === n ? 0 : n;
  updateFilterChipsUI();
  updateFilterToggleUI();
  renderGrid();
}

function updateFilterChipsUI(){
  document.querySelectorAll('.filter-chip[data-group="quartos"]').forEach(chip=>{
    chip.classList.toggle('active', Number(chip.dataset.val) === _filters.quartosMin);
  });
  document.querySelectorAll('.filter-chip[data-group="banheiros"]').forEach(chip=>{
    chip.classList.toggle('active', Number(chip.dataset.val) === _filters.banheirosMin);
  });
}

function updateFilterToggleUI(){
  const btn = document.getElementById('filter-toggle-btn');
  const badge = document.getElementById('filter-badge');
  const n = activeFilterCount();
  if(btn) btn.classList.toggle('active', n > 0);
  if(badge){ badge.style.display = n>0 ? 'flex' : 'none'; badge.textContent = n; }
}

function clearFilters(){
  _filters = { q:_filters.q, tipo:'', cidade:'', quartosMin:0, banheirosMin:0, precoMin:null, precoMax:null, finalidade:_filters.finalidade, ordenar:'' };
  const tipoEl = document.getElementById('f-tipo'); if(tipoEl) tipoEl.value='';
  const cidadeEl = document.getElementById('f-cidade'); if(cidadeEl) cidadeEl.value='';

  updateFilterToggleUI();
  renderGrid();

function onSearchInput(v){

  renderGrid();
}

// Usado pelo botão do estado vazio — diferente de clearFilters() (do painel),
// aqui zera também a busca por texto, já que "nenhum resultado" pode ter
// vindo só da busca, sem nenhum filtro do painel ativo.

function toggleFilterPanel(force){
  const panel = document.getElementById('filter-panel');
  const backdrop = document.getElementById('filter-backdrop');
  if(!panel || !backdrop) return;
  const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}

// Curtir direto no card da grade — mesmo evento 'like' usado na página
// de detalhe do imóvel (ver supabase-propostas-publicas.sql).
function curtirImovelCard(id, btn){
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('liked');
  const countEl = btn.querySelector('span');
  countEl.textContent = String(Number(countEl.textContent || 0) + 1);
  localStorage.setItem('captar_curtiu_' + id, '1');
  const desfazer = () => {
    btn.disabled = false;
    btn.classList.remove('liked');
    countEl.textContent = String(Math.max(0, Number(countEl.textContent || 1) - 1));
    localStorage.removeItem('captar_curtiu_' + id);
  };
  // .then(ok,fail) sozinho não pega erro do Postgres — o client do
  // Supabase resolve a promise normalmente e devolve { error } dentro
  // dela, não rejeita (mesmo detalhe corrigido em imovel-publico.html).
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'like' })
    .then(({ error }) => { if(error) desfazer(); }, desfazer);
  atualizarFavoritosUI();
}

// Favoritos — reaproveita o mesmo localStorage do curtir (não precisa de
// login nem de tabela nova). Deixa o cliente juntar vários imóveis do
// corretor e mandar o interesse em todos de uma vez, num lead só.
function getFavoritos(){
  return _lista.filter(im => localStorage.getItem('captar_curtiu_' + im.id) === '1');
}

let _favoritosViewMode = 'lista'; // 'lista' | 'comparar'

function atualizarFavoritosUI(){
  const fab = document.getElementById('favoritos-fab');
  if(!fab) return;
  const n = getFavoritos().length;
  fab.classList.toggle('show', n > 0);
  const countEl = document.getElementById('favoritos-fab-count');
  const pluralEl = document.getElementById('favoritos-fab-plural');
  if(countEl) countEl.textContent = n;
  if(pluralEl) pluralEl.textContent = n === 1 ? '' : 's';
  if(document.getElementById('favoritos-panel')?.classList.contains('open')) renderFavoritosBody();
}

function renderFavoritosBody(){
  const favoritos = getFavoritos();
  const compareBtn = document.getElementById('favoritos-compare-btn');
  if(compareBtn) compareBtn.style.display = favoritos.length >= 2 ? 'flex' : 'none';
  if(_favoritosViewMode === 'comparar' && favoritos.length >= 2) renderComparadorTable(favoritos);
  else renderFavoritosList(favoritos);
}

function toggleFavoritosCompare(){
  _favoritosViewMode = _favoritosViewMode === 'comparar' ? 'lista' : 'comparar';
  const btn = document.getElementById('favoritos-compare-btn');
  if(btn) btn.textContent = _favoritosViewMode === 'comparar' ? '← Ver lista' : 'Comparar';
  renderFavoritosBody();
}

function renderFavoritosList(favoritos){
  const listEl = document.getElementById('favoritos-list');
  if(!listEl) return;
  if(!favoritos.length){
    listEl.innerHTML = `<div class="favoritos-empty">Você ainda não curtiu nenhum imóvel. Toque no coração de um card pra adicionar aqui.</div>`;
    return;
  }
  listEl.innerHTML = favoritos.map(im => `
    <div class="favorito-item">
      ${Array.isArray(im.fotos) && im.fotos.length
        ? `<img class="favorito-item-img" src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" loading="lazy" alt=""/>`
        : `<div class="favorito-item-img" style="display:flex;align-items:center;justify-content:center;font-size:20px">${escHtml(im.emoji||'🏠')}</div>`}
      <div class="favorito-item-body">
        <div class="favorito-item-price">${escHtml(im.preco || 'Sob consulta')}</div>
        <div class="favorito-item-addr">${escHtml(im.endereco || '—')}</div>
      </div>
      <button type="button" class="favorito-item-remove" onclick="removerFavorito('${escHtml(String(im.id))}')" title="Remover">${ICON_X}</button>
    </div>
  `).join('');
}

// Comparador — mesma lista de favoritos, só que lado a lado. Sem CTA
// próprio: o formulário de contato já fica logo abaixo no mesmo painel,
// então comparar e mandar o interesse é a mesma jornada, sem modal extra.
function renderComparadorTable(favoritos){
  const listEl = document.getElementById('favoritos-list');
  if(!listEl) return;
  const linhas = [
    { label: 'Preço', val: im => `<span class="comp-price">${escHtml(im.preco || 'Sob consulta')}</span>` },
    { label: 'Tipo', val: im => escHtml(im.tipo || '—') },
    { label: 'Quartos', val: im => escHtml(String(im.quartos || '—')) },
    { label: 'Banheiros', val: im => escHtml(String(im.banheiros || '—')) },
    { label: 'Área', val: im => escHtml(formatAreaValor(String(im.area||'').split(' / ')[0]) || '—') },
    { label: 'Endereço', val: im => escHtml(im.endereco || '—') }
  ];
  listEl.innerHTML = `
    <div class="comparador-wrap">
      <table class="comparador-table">
        <tr>
          <td></td>
          ${favoritos.map(im => `<td>${Array.isArray(im.fotos)&&im.fotos.length
            ? `<img class="comp-img" src="${escHtml(fotoPublicUrl('imoveis-fotos', im.fotos[0]))}" loading="lazy" alt=""/>`
            : `<div class="comp-img" style="display:flex;align-items:center;justify-content:center;font-size:18px">${escHtml(im.emoji||'🏠')}</div>`}</td>`).join('')}
        </tr>
        ${linhas.map(l => `
        <tr>
          <td>${l.label}</td>
          ${favoritos.map(im => `<td>${l.val(im)}</td>`).join('')}
        </tr>
        `).join('')}
        <tr>
          <td></td>
          ${favoritos.map(im => `<td><button type="button" class="favorito-item-remove" onclick="removerFavorito('${escHtml(String(im.id))}')" title="Remover">${ICON_X}</button></td>`).join('')}
        </tr>

}

function removerFavorito(id){
  localStorage.removeItem('captar_curtiu_' + id);
  document.querySelectorAll(`.im-card-like[onclick*="'${id}'"]`).forEach(btn=>{
    btn.disabled = false;
    btn.classList.remove('liked');
    const countEl = btn.querySelector('span');
    if(countEl) countEl.textContent = String(Math.max(0, Number(countEl.textContent||1) - 1));
  });
  renderFavoritosBody();
  atualizarFavoritosUI();
}

function toggleFavoritosPanel(force){
  const panel = document.getElementById('favoritos-panel');
  const backdrop = document.getElementById('favoritos-backdrop');
  if(!panel || !backdrop) return;
  const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
  if(open){
    _favoritosViewMode = 'lista';
    const compareBtn = document.getElementById('favoritos-compare-btn');
    if(compareBtn) compareBtn.textContent = 'Comparar';
    renderFavoritosBody();
  }
}

async function enviarFavoritosInteresse(event){
  event.preventDefault();
  const favoritos = getFavoritos();
  if(!favoritos.length) return false;
  const nome = document.getElementById('favoritos-nome').value.trim();
  const tel = document.getElementById('favoritos-tel').value.trim();
  const btn = document.getElementById('favoritos-submit-btn');
  const feedback = document.getElementById('favoritos-feedback');
  const titulos = favoritos.map(im => im.titulo || im.tipo || 'Imóvel');
  const resumo = titulos.length > 4
    ? `${titulos.slice(0,4).join(', ')} e mais ${titulos.length-4}`
    : titulos.join(', ');
  btn.disabled = true;
  feedback.className = 'vender-feedback';
  feedback.textContent = '';
  try{
    const { error } = await _sb.rpc('enviar_proposta_publica', {
      p_user_id: _venderUserId,
      p_nome: nome,
      p_tel: tel,
      p_mensagem: `Interesse em ${favoritos.length} imóve${favoritos.length===1?'l':'is'} favoritado${favoritos.length===1?'':'s'}`,
      p_imovel_titulo: resumo
    });
    if(error) throw error;
    feedback.className = 'vender-feedback ok';
    feedback.textContent = 'Recebido! O corretor vai entrar em contato em breve.';
    document.getElementById('favoritos-form').reset();
    setTimeout(() => toggleFavoritosPanel(false), 1800);
  }catch(e){
    feedback.className = 'vender-feedback err';
    feedback.textContent = 'Não deu pra enviar agora. Tenta de novo em instantes.';
  }finally{
    btn.disabled = false;
  }
  return false;
}

// depoimentos_publicos.aprovado é uma coluna nova — se a migration
// ainda não rodou nesse projeto, o filtro por ela quebra a query
// inteira. Nesse caso cai pra mostrar todos (mesmo comportamento de
// antes dessa coluna existir, sem moderação).
async function fetchDepoimentosAprovados(id){
  let {data, error} = await _sb.from('depoimentos_publicos').select('*').eq('user_id', id).eq('aprovado', true).order('created_at', { ascending: false });
  if(error){
    ({data, error} = await _sb.from('depoimentos_publicos').select('*').eq('user_id', id).order('created_at', { ascending: false }));
  }
  return data || [];
}

// loteamentos.publico é coluna nova — se a migration ainda não rodou,
// a query falha. Diferente do fallback de depoimentos, aqui o certo é
// devolver vazio (nunca mostrar tudo): antes dessa coluna existir,
// nenhum empreendimento era público, então "coluna ausente" não pode
// virar "mostra tudo por engano".
async function fetchLoteamentosPublicos(id){
  const {data, error} = await _sb.from('loteamentos').select('*').eq('user_id', id).eq('publico', true).order('created_at', { ascending: false });
  if(error) return [];
  return data || [];
}

async function load(){
  const params = new URLSearchParams(location.search);
  // O rewrite do Vercel (/c/:slug -> /corretor-publico.html?u=:slug) é
  // invisível pro JS do navegador: location.search continua vazio, o
  // slug só aparece em location.pathname. Por isso o ?u= no destino do
  // rewrite serve só de documentação — na prática precisamos ler o path.
  const pathMatch = location.pathname.match(/\/c\/([^/]+)\/?$/);
  const slug = params.get('u') || (pathMatch ? decodeURIComponent(pathMatch[1]) : '');
  let id = params.get('id');
  if(!slug && !id){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do corretor.');
    return;
  }

  // Aceita tanto o link antigo (?id=uuid) quanto o novo, com o nome do
  // corretor no link (?u=slug, ou /c/slug via rewrite do Vercel).
  const query = slug
    ? _sb.from('perfil_publico').select('*').eq('slug', slug)
    : _sb.from('perfil_publico').select('*').eq('user_id', id);
  const {data: perfil, error} = await query.eq('ativo', true).maybeSingle();
  if(perfil)id = perfil.user_id;
  _venderUserId = id;

  if(error || !perfil){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Esse perfil não está disponível publicamente, ou o link está incorreto.');
    return;
  }

  document.title = `${perfil.nome || 'Corretor'} — Grupo Captar`;
  if(perfil.nome){
    document.getElementById('header-brand-name').textContent = perfil.nome;
    document.getElementById('header-brand-sep').style.display = '';
  }

  if(perfil.cor_destaque){
    document.documentElement.style.setProperty('--purple-light', perfil.cor_destaque);
    document.documentElement.style.setProperty('--purple', perfil.cor_destaque);
  }

  const [{data: imoveisData}, depoimentosData, {data: tempoRespostaMin}, loteamentosData] = await Promise.all([
    _sb.from('imoveis').select('*').eq('user_id', id).eq('publico', true).order('created_at', { ascending: false }),
    fetchDepoimentosAprovados(id),
    _sb.rpc('obter_tempo_resposta_publico', { p_user_id: id }),
    fetchLoteamentosPublicos(id)
  ]);
  const depoimentos = depoimentosData || [];
  const loteamentos = loteamentosData || [];
  // Imóveis marcados como destaque pelo corretor aparecem primeiro —
  // sort estável, então dentro de cada grupo (destaque / não-destaque)
  // a ordem por data mais recente já vinda do banco é preservada.
  // Vendidos saem da grade principal (que é "imóveis disponíveis") e
  // ficam só na vitrine "Já vendemos" abaixo — mistura confunde o
  // cliente que está procurando algo pra comprar/alugar agora.
  _lista = (imoveisData || []).filter(im => im.status !== 'Vendido').sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0));
  // "Selo" e vitrine de vendidos — só com números reais (nunca inventa
  // título tipo "Top Corretor"; mostra a contagem de verdade e deixa o
  // visitante tirar a própria conclusão).
  const vendidos = (imoveisData || []).filter(im => im.status === 'Vendido');
  // Selo "Responde rápido" — só aparece com amostra real suficiente
  // (a function já garante isso), nunca é um número inventado.
  const tempoRespostaTxt = tempoRespostaMin
    ? (tempoRespostaMin < 60 ? `${tempoRespostaMin} min` : `${Math.round(tempoRespostaMin/60)}h`)
    : null;

function abrirVenderPanel(){
  const backdrop=document.getElementById('vender-backdrop'), panel=document.getElementById('vender-panel');
  if(!backdrop||!panel)return;
  backdrop.classList.add('open');
  panel.classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('vender-nome')?.focus(),300);
}

function fecharVenderPanel(){
  const backdrop=document.getElementById('vender-backdrop'), panel=document.getElementById('vender-panel');
  if(backdrop)backdrop.classList.remove('open');
  if(panel)panel.classList.remove('open');
  document.body.style.overflow='';
}

async function enviarVenda(event){
  event.preventDefault();
  const nome=document.getElementById('vender-nome').value.trim();
  const tel=document.getElementById('vender-tel').value.trim();
  const msg=document.getElementById('vender-msg').value.trim();
  const btn=document.getElementById('vender-submit-btn');
  const feedback=document.getElementById('vender-feedback');
  if(!nome||!tel){
    feedback.className='vender-feedback err';
    feedback.textContent='Preenche nome e telefone pra gente conseguir te retornar.';
    return false;
  }
  btn.disabled=true;
  feedback.className='vender-feedback';
  feedback.textContent='';
  try{
    const {error}=await _sb.rpc('enviar_proposta_publica',{
      p_user_id:_venderUserId, p_nome:nome, p_tel:tel, p_mensagem:msg,
      p_imovel_titulo:'Quer vender/alugar imóvel'
    });
    if(error)throw error;
    feedback.className='vender-feedback ok';
    feedback.textContent='Recebido! O corretor vai entrar em contato em breve.';
    document.getElementById('vender-form').reset();
    setTimeout(fecharVenderPanel,1800);
  }catch(e){
    feedback.className='vender-feedback err';
    feedback.textContent='Não deu pra enviar agora. Tenta de novo em instantes, ou fala direto pelo WhatsApp.';
  }finally{
    btn.disabled=false;
  }
  return false;
}

// Alerta de novo imóvel — não existe disparo automático nesse projeto
// (precisaria de integração de e-mail/WhatsApp que não temos), então
// isso vira um lead com o critério do cliente pro corretor acompanhar
// manualmente. A cópia da tela é honesta sobre isso: "avisa" implica o
// corretor, nunca promete um sistema automático que não existe.
function abrirAlertaPanel(){
  const backdrop=document.getElementById('alerta-backdrop'), panel=document.getElementById('alerta-panel');
  if(!backdrop||!panel)return;
  backdrop.classList.add('open');
  panel.classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('alerta-nome')?.focus(),300);
}

function fecharAlertaPanel(){
  const backdrop=document.getElementById('alerta-backdrop'), panel=document.getElementById('alerta-panel');
  if(backdrop)backdrop.classList.remove('open');
  if(panel)panel.classList.remove('open');
  document.body.style.overflow='';
}

async function enviarAlerta(event){
  event.preventDefault();
  const nome=document.getElementById('alerta-nome').value.trim();
  const tel=document.getElementById('alerta-tel').value.trim();
  const tipo=document.getElementById('alerta-tipo')?.value||'';
  const cidade=document.getElementById('alerta-cidade')?.value||'';
  const precoMin=document.getElementById('alerta-preco-min').value;
  const precoMax=document.getElementById('alerta-preco-max').value;
  const btn=document.getElementById('alerta-submit-btn');
  const feedback=document.getElementById('alerta-feedback');
  if(!nome||!tel){
    feedback.className='vender-feedback err';
    feedback.textContent='Preenche nome e telefone pra gente conseguir te avisar.';
    return false;
  }
  const criterios=[tipo, cidade].filter(Boolean).join(' em ');
  const faixa=(precoMin||precoMax) ? `entre R$ ${Number(precoMin||0).toLocaleString('pt-BR')} e ${precoMax?('R$ '+Number(precoMax).toLocaleString('pt-BR')):'sem limite'}` : '';
  const resumo=[criterios, faixa].filter(Boolean).join(', ') || 'qualquer imóvel novo';
  btn.disabled=true;
  feedback.className='vender-feedback';
  feedback.textContent='';
  try{
    const {error}=await _sb.rpc('enviar_proposta_publica',{
      p_user_id:_venderUserId, p_nome:nome, p_tel:tel,
      p_mensagem:`Quer ser avisado quando surgir: ${resumo}`,
      p_imovel_titulo:'Alerta de novo imóvel',
      p_valor_oferta: faixa || ''
    });
    if(error)throw error;
    feedback.className='vender-feedback ok';
    feedback.textContent='Recebido! O corretor te avisa assim que tiver algo assim.';
    document.getElementById('alerta-form').reset();
    setTimeout(fecharAlertaPanel,1800);
  }catch(e){
    feedback.className='vender-feedback err';
    feedback.textContent='Não deu pra enviar agora. Tenta de novo em instantes.';
  }finally{
    btn.disabled=false;
  }
  return false;
}

// Depoimento enviado direto pelo cliente — fica pendente até o
// corretor aprovar no dashboard (ver supabase-depoimento-cliente-publico.sql).

async function enviarDepoimentoPublico(event){
  event.preventDefault();

    return false;
  }
  btn.disabled=true;
  feedback.className='vender-feedback';
  feedback.textContent='';
  try{
    const {error}=await _sb.rpc('enviar_depoimento_publico',{

    feedback.textContent='Não deu pra enviar agora. Tenta de novo em instantes.';
  }finally{
    btn.disabled=false;
  }
  return false;
}
