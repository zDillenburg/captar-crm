<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Imóvel — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --p:#850277;--pl:#a3039a;--pd:#620158;
    --bg:#0f0d0b;--bg2:#161310;--bg3:#1c1916;--bg4:#221e1b;
    --border:rgba(255,255,255,0.08);
    --t1:#fffdea;--t2:rgba(255,253,234,.65);--t3:#8a8070;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  .serif{font-family:'Fraunces',serif}
  header{display:flex;align-items:center;justify-content:center;padding:20px;border-bottom:1px solid var(--border)}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:32px;width:auto}
  main{flex:1;display:flex;justify-content:center;padding:32px 16px 64px}
  .wrap{width:100%;max-width:660px}

  @media(prefers-reduced-motion:no-preference){
    .fade-up{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
    .fade-up.d1{animation-delay:.06s}
    .fade-up.d2{animation-delay:.12s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  }

  .state-box{text-align:center;padding:80px 20px;color:var(--t3)}
  .state-box svg{width:40px;height:40px;margin-bottom:16px;opacity:.5}
  .state-box p{font-size:14px;line-height:1.7}

  .hero{border-radius:18px;padding:56px 24px;text-align:center;font-size:56px;margin-bottom:22px;position:relative;overflow:hidden}
  .status-pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}

  .gallery-main{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:10px;background:var(--bg2);position:relative}
  .gallery-main img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:2px}
  .gallery-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;flex-shrink:0;opacity:.55;transition:opacity .15s,border-color .15s}
  .gallery-thumbs img.active{opacity:1;border-color:var(--pl)}

  .corretor-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:18px;transition:border-color .15s ease,transform .15s ease}
  .corretor-card:hover{border-color:var(--pl);transform:translateY(-1px)}
  .corretor-logo{width:46px;height:46px;border-radius:11px;object-fit:contain;background:#fff;flex-shrink:0}
  .corretor-avatar-fallback{width:46px;height:46px;border-radius:11px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
  .corretor-info{flex:1;min-width:0}
  .corretor-label{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .corretor-name{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .corretor-cta{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--pl);font-weight:700;white-space:nowrap;flex-shrink:0}
  .corretor-cta svg{width:12px;height:12px}

  .price{font-family:'Fraunces',serif;font-size:32px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
  .title{font-size:15.5px;color:var(--t2);margin-bottom:6px}
  .address{font-size:13px;color:var(--t3);margin-bottom:24px;display:flex;align-items:center;gap:6px}
  .address svg{width:13px;height:13px;flex-shrink:0}

  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:26px}
  .description{font-size:13.5px;color:var(--t2);line-height:1.75;margin-bottom:26px;white-space:pre-wrap}
  .spec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center}
  .spec-val{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:2px}
  .spec-lbl{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}

  .section-label{font-size:11px;font-weight:700;color:var(--pl);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .features{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .features li{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--t2)}

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#25d366;color:#fff;font-size:15px;font-weight:700;
    padding:16px;border-radius:12px;text-decoration:none;margin-bottom:14px;
  }
  .cta svg{width:20px;height:20px;flex-shrink:0}
  .disclaimer{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.6}

  footer{text-align:center;padding:22px;border-top:1px solid var(--border);font-size:12px;color:var(--t3)}
  footer a{color:var(--pl);text-decoration:none;font-weight:700}

  @media(max-width:480px){
    .hero{font-size:44px;padding:44px 20px}
    .price{font-size:24px}
  }
</style>
</head>
<body>

  <header>
    <a href="index.html">
      <img src="logo.svg" alt="Grupo Captar"/>
    </a>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Carregando imóvel…</p>
      </div>
    </div>
  </main>

  <footer>
    Anúncio de <a href="index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

<script>
const SUPABASE_URL = 'https://ntebllysafkushvhubos.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50ZWJsbHlzYWZrdXNodmh1Ym9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjUyNjEsImV4cCI6MjA5NDEwMTI2MX0.2Zxqc5oISDGWlSOhi6Zse0uVdY5pateMcMw9wLxYESY';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Monta o número com DDI 55 pro wa.me, sem duplicar quando o telefone já
// foi salvo com o código do país. BR local = 10-11 dígitos; com DDI = 12-13.
function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

let _fotosAtual = [];
function fotoPublicUrl(bucket, path){
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// Formata um valor de área isolado: se for só número (com . ou , de milhar),
// assume m² — mas respeita o texto se o corretor já digitou a unidade (ex: "12 ha").
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}
// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaParts(raw){
  return String(raw||'').split(' / ').map(p=>p.trim()).filter(Boolean).map(formatAreaValor);
}
function trocarFotoGaleria(idx){
  const mainImg = document.getElementById('gallery-main-img');
  if(mainImg && _fotosAtual[idx]) mainImg.src = fotoPublicUrl('imoveis-fotos', _fotosAtual[idx]);
  document.querySelectorAll('.gallery-thumbs img').forEach((el,i)=>el.classList.toggle('active', i===idx));
}

function renderState(iconPath, msg){
  document.getElementById('content').innerHTML = `<div class="state-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${iconPath}</svg>
    <p>${escHtml(msg)}</p>
  </div>`;
}

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do imóvel.');
    return;
  }

  const {data: im, error} = await _sb.from('imoveis').select('*').eq('id', id).eq('publico', true).maybeSingle();

  if(error || !im){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Esse imóvel não está mais disponível publicamente, ou o link está incorreto.');
    return;
  }

  document.title = `${im.titulo || 'Imóvel'} — Grupo Captar`;
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'view' }).then(() => {}, () => {});

  // Aplica a cor de destaque do corretor, se ele tiver um perfil
  // público ativo com uma cor escolhida — mantém a marca consistente
  // entre o perfil dele e as páginas de cada imóvel.
  if (im.user_id) {
    _sb.from('perfil_publico').select('cor_destaque').eq('user_id', im.user_id).eq('ativo', true).maybeSingle()
      .then(({ data: perfil }) => {
        if (perfil && perfil.cor_destaque) {
          document.documentElement.style.setProperty('--pl', perfil.cor_destaque);
          document.documentElement.style.setProperty('--p', perfil.cor_destaque);
        }
      }, () => {});
  }

  const featuresList = (im.features || '').split(',').map(f => f.trim()).filter(Boolean);
  const waText = encodeURIComponent(`Olá! Tenho interesse no imóvel "${im.titulo || ''}" que vi no link do Grupo Captar.`);
  const corretorWaPhone = waPhoneBR(im.corretor_tel || '');
  _fotosAtual = Array.isArray(im.fotos) ? im.fotos : [];
  const temFotos = _fotosAtual.length > 0;
  const corretorLogoUrl = im.user_id ? fotoPublicUrl('logos', `${im.user_id}/avatar.jpg`) : '';

  document.getElementById('content').innerHTML = `
    ${temFotos ? `
    <div class="gallery-main">
      <img id="gallery-main-img" src="${escHtml(fotoPublicUrl('imoveis-fotos', _fotosAtual[0]))}" alt="${escHtml(im.titulo || 'Imóvel')}"/>
      ${im.status ? `<span class="status-pill">${escHtml(im.status)}</span>` : ''}
    </div>
    ${_fotosAtual.length > 1 ? `<div class="gallery-thumbs">${_fotosAtual.map((p, i) => `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', p))}" class="${i === 0 ? 'active' : ''}" onclick="trocarFotoGaleria(${i})" alt=""/>`).join('')}</div>` : ''}
    ` : `
    <div class="hero" style="background:${escHtml(im.grad || 'linear-gradient(135deg,#1e3a5f,#1e40af)')}">
      ${im.status ? `<span class="status-pill">${escHtml(im.status)}</span>` : ''}
      ${escHtml(im.emoji || '🏠')}
    </div>
    `}
    <div class="fade-up">
    <div class="price">${escHtml(im.preco || 'Sob consulta')}</div>
    <div class="title">${escHtml(im.titulo || 'Imóvel')}${im.tipo ? ' · ' + escHtml(im.tipo) : ''}</div>
    <div class="address">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      ${escHtml(im.endereco || 'Localização a combinar')}
    </div>
    </div>
    <div class="specs fade-up d1">
      ${Number(im.quartos) > 0 ? `<div class="spec"><div class="spec-val">${escHtml(String(im.quartos))}</div><div class="spec-lbl">Quartos</div></div>` : ''}
      <div class="spec"><div class="spec-val">${escHtml(String(im.banheiros || 1))}</div><div class="spec-lbl">Banheiros</div></div>
      ${(() => {
        const areaParts = formatAreaParts(im.area);
        if (!areaParts.length) return `<div class="spec"><div class="spec-val">—</div><div class="spec-lbl">Área</div></div>`;
        const labels = areaParts.length > 1 ? ['Área', 'Terreno'] : ['Área'];
        return areaParts.map((v, i) => `<div class="spec"><div class="spec-val">${escHtml(v)}</div><div class="spec-lbl">${labels[i] || 'Área'}</div></div>`).join('');
      })()}
    </div>
    ${im.descricao ? `<p class="description">${escHtml(im.descricao)}</p>` : ''}
    ${featuresList.length ? `
      <div class="section-label">Diferenciais</div>
      <ul class="features">${featuresList.map(f => `<li>${escHtml(f)}</li>`).join('')}</ul>
    ` : ''}
    ${im.corretor ? `
    <a class="corretor-card" href="corretor-publico.html?id=${encodeURIComponent(im.user_id || '')}" style="text-decoration:none;cursor:pointer">
      <img class="corretor-logo" src="${escHtml(corretorLogoUrl)}" data-fallback-initials="${escHtml(initialsOf(im.corretor))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'corretor-avatar-fallback',textContent:this.dataset.fallbackInitials}))"/>
      <div class="corretor-info">
        <div class="corretor-label">Anunciado por</div>
        <div class="corretor-name">${escHtml(im.corretor)}</div>
      </div>
      <span class="corretor-cta">Ver todos <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
    ` : ''}
    ${corretorWaPhone ? `
    <a class="cta" href="https://wa.me/${corretorWaPhone}?text=${waText}" target="_blank" rel="noopener noreferrer" onclick="registrarCliqueWhatsapp('${escHtml(String(id))}')">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.027 7.77L0 32l8.43-2.007A15.934 15.934 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 01-6.77-1.848l-.485-.287-5.005 1.192 1.215-4.872-.317-.5A13.27 13.27 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.27-9.87c-.398-.199-2.356-1.163-2.72-1.295-.365-.133-.631-.199-.897.199-.265.398-1.03 1.295-1.263 1.56-.232.266-.465.299-.863.1-.398-.199-1.681-.62-3.203-1.977-1.184-1.057-1.983-2.362-2.215-2.76-.232-.398-.025-.613.174-.811.179-.178.398-.465.598-.698.199-.232.265-.398.398-.664.133-.265.066-.498-.033-.697-.1-.199-.897-2.163-1.23-2.96-.324-.778-.652-.673-.897-.685l-.764-.013c-.265 0-.697.1-1.063.498-.365.398-1.396 1.363-1.396 3.327s1.43 3.86 1.63 4.126c.198.265 2.814 4.297 6.82 6.026.954.412 1.698.658 2.279.842.957.305 1.829.262 2.517.159.768-.115 2.356-.963 2.688-1.894.332-.93.332-1.728.232-1.894-.099-.166-.365-.265-.763-.464z"/></svg>
      Falar sobre este imóvel
    </a>
    <p class="disclaimer">Anúncio compartilhado por um corretor parceiro do Grupo Captar. Fale direto pelo WhatsApp pra mais fotos, condições e visita.</p>
    ` : `
    <p class="disclaimer">Esse corretor ainda não configurou um WhatsApp de contato pra esse anúncio.</p>
    `}
  `;
}

function registrarCliqueWhatsapp(id){
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'whatsapp' }).then(() => {}, () => {});
}

load();
</script>
</body>
</html>
