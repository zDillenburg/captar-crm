<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Imóvel — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --p:#850277;--pl:#a3039a;--pd:#620158;
    --bg:#000000;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
    --border:rgba(255,255,255,0.09);
    --t1:#f5f5f7;--t2:rgba(245,245,247,.68);--t3:rgba(245,245,247,.42);
  }
  body.light-mode{
    --bg:#ffffff;--bg2:#f5f5f7;--bg3:#ececee;--bg4:#e2e2e5;
    --border:rgba(0,0,0,0.08);
    --t1:#1d1d1f;--t2:rgba(29,29,31,.68);--t3:rgba(29,29,31,.45);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background .2s ease,color .2s ease}
  a{color:inherit}
  header{display:flex;align-items:center;justify-content:center;padding:22px;border-bottom:1px solid var(--border);position:relative}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:26px;width:auto;opacity:.9}
  body.light-mode header img{filter:brightness(0) saturate(0);opacity:.85}
  .theme-toggle{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:var(--bg2);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2);
  }
  main{flex:1;display:flex;justify-content:center;padding:32px 20px 130px}
  .wrap{width:100%;max-width:600px}

  @media(prefers-reduced-motion:no-preference){
    .fade-up{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
    .fade-up.d1{animation-delay:.05s}
    .fade-up.d2{animation-delay:.1s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  }

  .state-box{text-align:center;padding:100px 20px;color:var(--t3)}
  .state-box svg{width:36px;height:36px;margin-bottom:18px;opacity:.4}
  .state-box p{font-size:15px;line-height:1.6}

  .hero{border-radius:20px;padding:60px 24px;text-align:center;font-size:52px;margin-bottom:24px;position:relative;overflow:hidden;background:var(--bg2)}
  .status-pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px)}

  .gallery-main{width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;margin-bottom:10px;background:var(--bg2);position:relative;cursor:zoom-in}
  .gallery-main img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery-zoom-hint{position:absolute;bottom:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
  .gallery-zoom-hint svg{width:16px;height:16px}
  .gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:2px}
  .gallery-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:12px;cursor:pointer;opacity:.45;transition:opacity .15s}
  .gallery-thumbs img.active{opacity:1}

  /* ── Lightbox ─────────────────────────────── */
  .lightbox{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s ease}
  .lightbox.open{opacity:1;visibility:visible}
  .lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:8px;user-select:none}
  .lightbox-close,.lightbox-prev,.lightbox-next{
    position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:background .15s;
  }
  .lightbox-close:hover,.lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,.2)}
  .lightbox-close{top:20px;right:20px}
  .lightbox-prev{left:20px;top:50%;transform:translateY(-50%)}
  .lightbox-next{right:20px;top:50%;transform:translateY(-50%)}
  .lightbox-close svg,.lightbox-prev svg,.lightbox-next svg{width:20px;height:20px}
  .lightbox-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px;font-weight:500}
  @media(max-width:600px){
    .lightbox-prev,.lightbox-next{width:38px;height:38px}
    .lightbox-close{top:14px;right:14px}
  }

  .corretor-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border-radius:18px;margin-bottom:24px;transition:background .15s ease,transform .15s ease}
  .corretor-card:hover{background:var(--bg3);transform:translateY(-1px)}
  .corretor-logo{width:64px;height:64px;border-radius:18px;object-fit:contain;background:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .corretor-avatar-fallback{width:64px;height:64px;border-radius:18px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .corretor-info{flex:1;min-width:0}
  .corretor-label{font-size:11.5px;color:var(--t3);margin-bottom:3px;font-weight:500}
  .corretor-name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
  .corretor-creci{font-size:12px;color:var(--t3);font-weight:500}
  .corretor-cta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--t1);font-weight:600;white-space:nowrap;flex-shrink:0;background:var(--bg3);padding:9px 14px;border-radius:11px}
  .corretor-card:hover .corretor-cta{background:var(--bg4)}
  .corretor-cta svg{width:13px;height:13px}

  .price{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
  .title{font-size:15.5px;color:var(--t2);margin-bottom:6px}
  .address{font-size:13.5px;color:var(--t3);margin-bottom:24px;display:flex;align-items:center;gap:6px}
  .address svg{width:13px;height:13px;flex-shrink:0}

  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:28px}
  .description{font-size:15px;color:var(--t2);line-height:1.65;margin-bottom:28px;white-space:pre-wrap}
  .spec{background:var(--bg2);border-radius:14px;padding:14px 8px;text-align:center}
  .spec-val{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
  .spec-lbl{font-size:11px;color:var(--t3);font-weight:500}

  .section-label{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:14px}
  .features{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .features li{background:var(--bg2);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--t2);font-weight:500}

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#25d366;color:#fff;font-size:15px;font-weight:600;
    padding:15px;border-radius:14px;text-decoration:none;margin-bottom:16px;
  }
  .cta svg{width:19px;height:19px;flex-shrink:0}
  .disclaimer{font-size:12.5px;color:var(--t3);text-align:center;line-height:1.6}

  footer{text-align:center;padding:24px;border-top:1px solid var(--border);font-size:12.5px;color:var(--t3)}
  footer a{color:var(--t2);text-decoration:none;font-weight:600}

  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(10,10,10,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;justify-content:center;
  }
  body.light-mode .sticky-cta{background:rgba(255,255,255,.82)}
  .sticky-cta a{
    width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#25d366;color:#fff;font-size:15px;font-weight:600;padding:14px;border-radius:14px;text-decoration:none;
  }
  .sticky-cta svg{width:19px;height:19px;flex-shrink:0}

  @media(max-width:480px){
    .hero{font-size:42px;padding:48px 20px}
    .price{font-size:28px}
    .corretor-card{gap:10px;padding:14px}
    .corretor-logo,.corretor-avatar-fallback{width:52px;height:52px}
    .corretor-name{white-space:normal;overflow:visible;text-overflow:clip}
    .corretor-cta{padding:9px 10px}
    .corretor-cta span{display:none}
  }
</style>
</head>
<body>

  <header>
    <a href="/index.html">
      <img src="/logo.svg" alt="Grupo Captar"/>
    </a>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Carregando imóvel…</p>
      </div>
    </div>
  </main>

  <footer>
    Anúncio de <a href="/index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this)fecharLightbox()">
    <button class="lightbox-close" onclick="fecharLightbox()" title="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lightbox-prev" id="lightbox-prev" onclick="event.stopPropagation();navegarLightbox(-1)" title="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img id="lightbox-img" src="" alt=""/>
    <button class="lightbox-next" id="lightbox-next" onclick="event.stopPropagation();navegarLightbox(1)" title="Próxima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

<script>
const SUPABASE_URL = 'https://ntebllysafkushvhubos.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50ZWJsbHlzYWZrdXNodmh1Ym9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjUyNjEsImV4cCI6MjA5NDEwMTI2MX0.2Zxqc5oISDGWlSOhi6Zse0uVdY5pateMcMw9wLxYESY';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Tema claro/escuro — respeita a preferência do sistema por padrão, mas
// lembra a escolha manual do visitante (cliente do corretor) no navegador dele.
function toggleTheme(){
  const isLight=document.body.classList.toggle('light-mode');
  localStorage.setItem('captar_public_theme', isLight?'light':'dark');
  const btn=document.getElementById('theme-toggle-btn');
  if(btn)btn.textContent=isLight?'☀️':'🌙';
}
(function initTheme(){
  const saved=localStorage.getItem('captar_public_theme');
  const preferLight=saved?saved==='light':window.matchMedia('(prefers-color-scheme: light)').matches;
  if(preferLight){
    document.body.classList.add('light-mode');
    const btn=document.getElementById('theme-toggle-btn');
    if(btn)btn.textContent='☀️';
  }
})();

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Monta o número com DDI 55 pro wa.me, sem duplicar quando o telefone já
// foi salvo com o código do país. BR local = 10-11 dígitos; com DDI = 12-13.
function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return'';
  if((d.length===12||d.length===13)&&d.startsWith('55')) d=d.slice(2);
  return '55'+d;
}

let _fotosAtual = [];
function fotoPublicUrl(bucket, path){
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// Formata um valor de área isolado: se for só número (com . ou , de milhar),
// assume m² — mas respeita o texto se o corretor já digitou a unidade (ex: "12 ha").
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}
// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaParts(raw){
  return String(raw||'').split(' / ').map(p=>p.trim()).filter(Boolean).map(formatAreaValor);
}
let _fotoAtualIdx = 0;
function trocarFotoGaleria(idx){
  const mainImg = document.getElementById('gallery-main-img');
  if(mainImg && _fotosAtual[idx]) mainImg.src = fotoPublicUrl('imoveis-fotos', _fotosAtual[idx]);
  document.querySelectorAll('.gallery-thumbs img').forEach((el,i)=>el.classList.toggle('active', i===idx));
  _fotoAtualIdx = idx;
}

function abrirLightbox(idx){
  if(!_fotosAtual.length)return;
  _fotoAtualIdx = idx;
  atualizarLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function fecharLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
function navegarLightbox(delta){
  _fotoAtualIdx = (_fotoAtualIdx + delta + _fotosAtual.length) % _fotosAtual.length;
  atualizarLightbox();
}
function atualizarLightbox(){
  const img = document.getElementById('lightbox-img');
  const counter = document.getElementById('lightbox-counter');
  const prevBtn = document.getElementById('lightbox-prev');
  const nextBtn = document.getElementById('lightbox-next');
  img.src = fotoPublicUrl('imoveis-fotos', _fotosAtual[_fotoAtualIdx]);
  const varias = _fotosAtual.length > 1;
  if(counter){counter.textContent = varias ? `${_fotoAtualIdx+1} / ${_fotosAtual.length}` : ''; counter.style.display = varias?'block':'none';}
  if(prevBtn)prevBtn.style.display = varias?'flex':'none';
  if(nextBtn)nextBtn.style.display = varias?'flex':'none';
}
document.addEventListener('keydown', e=>{
  const lb = document.getElementById('lightbox');
  if(!lb || !lb.classList.contains('open'))return;
  if(e.key==='Escape')fecharLightbox();
  else if(e.key==='ArrowLeft')navegarLightbox(-1);
  else if(e.key==='ArrowRight')navegarLightbox(1);
});

function renderState(iconPath, msg){
  document.getElementById('content').innerHTML = `<div class="state-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${iconPath}</svg>
    <p>${escHtml(msg)}</p>
  </div>`;
}

const ICON_WHATSAPP = '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.027 7.77L0 32l8.43-2.007A15.934 15.934 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 01-6.77-1.848l-.485-.287-5.005 1.192 1.215-4.872-.317-.5A13.27 13.27 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.27-9.87c-.398-.199-2.356-1.163-2.72-1.295-.365-.133-.631-.199-.897.199-.265.398-1.03 1.295-1.263 1.56-.232.266-.465.299-.863.1-.398-.199-1.681-.62-3.203-1.977-1.184-1.057-1.983-2.362-2.215-2.76-.232-.398-.025-.613.174-.811.179-.178.398-.465.598-.698.199-.232.265-.398.398-.664.133-.265.066-.498-.033-.697-.1-.199-.897-2.163-1.23-2.96-.324-.778-.652-.673-.897-.685l-.764-.013c-.265 0-.697.1-1.063.498-.365.398-1.396 1.363-1.396 3.327s1.43 3.86 1.63 4.126c.198.265 2.814 4.297 6.82 6.026.954.412 1.698.658 2.279.842.957.305 1.829.262 2.517.159.768-.115 2.356-.963 2.688-1.894.332-.93.332-1.728.232-1.894-.099-.166-.365-.265-.763-.464z"/></svg>';

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Link inválido — falta o identificador do imóvel.');
    return;
  }

  const {data: im, error} = await _sb.from('imoveis').select('*').eq('id', id).eq('publico', true).maybeSingle();

  if(error || !im){
    renderState('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', 'Esse imóvel não está mais disponível publicamente, ou o link está incorreto.');
    return;
  }

  document.title = `${im.titulo || 'Imóvel'} — Grupo Captar`;
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'view' }).then(() => {}, () => {});

  // Busca o perfil público do corretor (cor de destaque + CRECI) — a
  // página do imóvel também mostra o CRECI, exigência comum em anúncios
  // imobiliários no Brasil, então vale a pena esperar essa consulta em
  // vez de só disparar e esquecer.
  let perfilCorretor = null;
  if (im.user_id) {
    const { data: perfil } = await _sb.from('perfil_publico').select('cor_destaque, creci, slug').eq('user_id', im.user_id).eq('ativo', true).maybeSingle();
    perfilCorretor = perfil;
    if (perfil && perfil.cor_destaque) {
      document.documentElement.style.setProperty('--pl', perfil.cor_destaque);
      document.documentElement.style.setProperty('--p', perfil.cor_destaque);
    }
  }
  const corretorCreci = (perfilCorretor?.creci || '').trim();
  const corretorPerfilUrl = perfilCorretor?.slug
    ? `/c/${encodeURIComponent(perfilCorretor.slug)}`
    : `/corretor-publico.html?id=${encodeURIComponent(im.user_id || '')}`;

  const featuresList = (im.features || '').split(',').map(f => f.trim()).filter(Boolean);
  const waText = encodeURIComponent(`Olá! Tenho interesse no imóvel "${im.titulo || ''}" que vi no link do Grupo Captar.`);
  const corretorWaPhone = waPhoneBR(im.corretor_tel || '');
  _fotosAtual = Array.isArray(im.fotos) ? im.fotos : [];
  const temFotos = _fotosAtual.length > 0;
  const corretorLogoUrl = im.user_id ? fotoPublicUrl('logos', `${im.user_id}/avatar.jpg`) : '';

  document.getElementById('content').innerHTML = `
    ${temFotos ? `
    <div class="gallery-main" onclick="abrirLightbox(_fotoAtualIdx)">
      <img id="gallery-main-img" src="${escHtml(fotoPublicUrl('imoveis-fotos', _fotosAtual[0]))}" alt="${escHtml(im.titulo || 'Imóvel')}"/>
      ${im.status ? `<span class="status-pill">${escHtml(im.status)}</span>` : ''}
      <div class="gallery-zoom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
    </div>
    ${_fotosAtual.length > 1 ? `<div class="gallery-thumbs">${_fotosAtual.map((p, i) => `<img src="${escHtml(fotoPublicUrl('imoveis-fotos', p))}" class="${i === 0 ? 'active' : ''}" onclick="trocarFotoGaleria(${i})" alt=""/>`).join('')}</div>` : ''}
    ` : `
    <div class="hero">
      ${im.status ? `<span class="status-pill">${escHtml(im.status)}</span>` : ''}
      ${escHtml(im.emoji || '🏠')}
    </div>
    `}
    <div class="fade-up">
    <div class="price">${escHtml(im.preco || 'Sob consulta')}</div>
    <div class="title">${escHtml(im.titulo || 'Imóvel')}${im.tipo ? ' · ' + escHtml(im.tipo) : ''}</div>
    <div class="address">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      ${escHtml(im.endereco || 'Localização a combinar')}
    </div>
    </div>
    ${im.corretor ? `
    <a class="corretor-card fade-up" href="${escHtml(corretorPerfilUrl)}" style="text-decoration:none;cursor:pointer">
      <img class="corretor-logo" src="${escHtml(corretorLogoUrl)}" data-fallback-initials="${escHtml(initialsOf(im.corretor))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'corretor-avatar-fallback',textContent:this.dataset.fallbackInitials}))"/>
      <div class="corretor-info">
        <div class="corretor-label">Anunciado por</div>
        <div class="corretor-name">${escHtml(im.corretor)}</div>
        ${corretorCreci ? `<div class="corretor-creci">CRECI ${escHtml(corretorCreci)}</div>` : ''}
      </div>
      <span class="corretor-cta"><span>Ver perfil</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
    ` : ''}
    <div class="specs fade-up d1">
      ${Number(im.quartos) > 0 ? `<div class="spec"><div class="spec-val">${escHtml(String(im.quartos))}</div><div class="spec-lbl">Quartos</div></div>` : ''}
      <div class="spec"><div class="spec-val">${escHtml(String(im.banheiros || 1))}</div><div class="spec-lbl">Banheiros</div></div>
      ${(() => {
        const areaParts = formatAreaParts(im.area);
        if (!areaParts.length) return `<div class="spec"><div class="spec-val">—</div><div class="spec-lbl">Área</div></div>`;
        const labels = areaParts.length > 1 ? ['Área', 'Terreno'] : ['Área'];
        return areaParts.map((v, i) => `<div class="spec"><div class="spec-val">${escHtml(v)}</div><div class="spec-lbl">${labels[i] || 'Área'}</div></div>`).join('');
      })()}
    </div>
    ${im.descricao ? `<p class="description">${escHtml(im.descricao)}</p>` : ''}
    ${featuresList.length ? `
      <div class="section-label">Diferenciais</div>
      <ul class="features">${featuresList.map(f => `<li>${escHtml(f)}</li>`).join('')}</ul>
    ` : ''}
    ${corretorWaPhone ? `
    <p class="disclaimer">Anúncio compartilhado por um corretor parceiro do Grupo Captar. Fale direto pelo WhatsApp pra mais fotos, condições e visita.</p>
    ` : `
    <p class="disclaimer">Esse corretor ainda não configurou um WhatsApp de contato pra esse anúncio.</p>
    `}
  `;

  if(corretorWaPhone){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="sticky-cta">
        <a href="https://wa.me/${corretorWaPhone}?text=${waText}" target="_blank" rel="noopener noreferrer" onclick="registrarCliqueWhatsapp('${escHtml(String(id))}')">${ICON_WHATSAPP} Falar sobre este imóvel</a>
      </div>
    `);
  }
}

function registrarCliqueWhatsapp(id){
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'whatsapp' }).then(() => {}, () => {});
}

load();
</script>
</body>
</html>
