<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Imóvel — Grupo Captar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --purple:#850277;--purple-light:#a3039a;--purple-dark:#620158;
    --black:#100e0d;--ink:#0a0908;--base:#100e0d;--surface:#17140f;--surface-2:#1d1916;
    --line:rgba(255,253,234,.085);--line-mid:rgba(255,253,234,.14);--line-strong:rgba(255,253,234,.22);
    --t-100:#fffdea;--t-70:rgba(255,253,234,.70);--t-55:rgba(255,253,234,.55);--t-40:rgba(255,253,234,.52);--t-28:rgba(255,253,234,.46);
    --r-xs:6px;--r-sm:10px;--r:14px;--r-lg:22px;
    --ease:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.4,0,.2,1);
  }
  body.light-mode{
    --black:#fffdea;--ink:#fffdea;--base:#fffdea;--surface:#f5f3e4;--surface-2:#ece9d5;
    --line:rgba(16,14,13,.08);--line-mid:rgba(16,14,13,.14);--line-strong:rgba(16,14,13,.24);
    --t-100:#100e0d;--t-70:rgba(16,14,13,.72);--t-55:rgba(16,14,13,.56);--t-40:rgba(16,14,13,.48);--t-28:rgba(16,14,13,.40);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--base);color:var(--t-100);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background .25s ease,color .25s ease}
  a{color:inherit}
  ::selection{background:var(--purple-light);color:#fff}
  header{display:flex;align-items:center;justify-content:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--base) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
  header img{height:24px;width:auto;opacity:.92}
  body.light-mode header img{filter:brightness(0) saturate(0);opacity:.82}
  .theme-toggle{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t-70);transition:background .2s ease,transform .2s var(--ease);
  }
  .theme-toggle:hover{background:var(--surface-2);transform:translateY(-50%) scale(1.06)}
  main{flex:1;display:flex;justify-content:center;padding:28px 20px 130px}
  .wrap{width:100%;max-width:620px}

  @media(prefers-reduced-motion:no-preference){
    /* SEM opacity aqui de propósito — ver corretor-publico.html pro motivo:
       só animar `transform` garante que o conteúdo esteja sempre visível
       desde o primeiro frame, mesmo se a animação nunca terminar de
       verdade (aba em segundo plano, navegador suspendendo a animação). */
    .fade-up{transform:translateY(14px);animation:fadeUp .6s var(--ease) forwards}
    .fade-up.d1{animation-delay:.07s}
    .fade-up.d2{animation-delay:.14s}
    .fade-up.d3{animation-delay:.2s}
    @keyframes fadeUp{to{transform:translateY(0)}}
    .chip-in{transform:translateY(8px);animation:chipIn .4s var(--ease) forwards;animation-delay:calc(var(--i,0) * 35ms)}
    @keyframes chipIn{to{transform:translateY(0)}}
  }
  @media(prefers-reduced-motion:reduce){
    .fade-up,.chip-in{opacity:1!important;transform:none!important;animation:none!important}
  }

  .state-box{text-align:center;padding:100px 20px;color:var(--t-40)}
  .state-box svg{width:36px;height:36px;margin-bottom:18px;opacity:.5}
  .state-box p{font-size:15px;line-height:1.6}

  /* ── Skeleton de carregamento ─────────────────────── */
  .skel{background:linear-gradient(90deg, var(--surface) 22%, var(--surface-2) 40%, var(--surface) 58%);background-size:400% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--r)}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-20% 0}}
  .skel-gallery{width:100%;aspect-ratio:4/3;margin-bottom:20px;border-radius:20px}
  .skel-line{height:16px;margin-bottom:12px}
  .skel-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
  .skel-spec{height:60px}
  @media(prefers-reduced-motion:reduce){.skel{animation:none;background:var(--surface)}}

  .hero{border-radius:20px;padding:60px 24px;text-align:center;font-size:52px;margin-bottom:24px;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
  .status-pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 13px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(10px)}
  .finalidade-pill{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 13px;border-radius:20px;background:rgba(59,130,246,.92);color:#0a1526}

  .gallery-main{width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;margin-bottom:10px;background:var(--surface);position:relative;cursor:zoom-in;border:1px solid var(--line)}
  .gallery-main img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
  .gallery-main:hover img{transform:scale(1.035)}
  .gallery-zoom-hint{position:absolute;bottom:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none;transition:transform .25s var(--ease)}
  .gallery-main:hover .gallery-zoom-hint{transform:scale(1.1)}
  .gallery-zoom-hint svg{width:16px;height:16px}
  .gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:26px;padding-bottom:2px}
  .gallery-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:12px;cursor:pointer;opacity:.42;transition:opacity .2s,transform .2s var(--ease);flex-shrink:0}
  .gallery-thumbs img:hover{opacity:.75}
  .gallery-thumbs img.active{opacity:1;transform:scale(1.04)}

  /* ── Lightbox ─────────────────────────────── */
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s ease}
  .lightbox.open{opacity:1;visibility:visible}
  .lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:8px;user-select:none}
  .lightbox-close,.lightbox-prev,.lightbox-next{
    position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:background .18s,transform .18s var(--ease);
  }
  .lightbox-close:hover,.lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
  .lightbox-close{top:20px;right:20px}
  .lightbox-prev{left:20px;top:50%;transform:translateY(-50%)}
  .lightbox-next{right:20px;top:50%;transform:translateY(-50%)}
  .lightbox-close svg,.lightbox-prev svg,.lightbox-next svg{width:20px;height:20px}
  .lightbox-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px;font-weight:600}
  @media(max-width:600px){
    .lightbox-prev,.lightbox-next{width:38px;height:38px}
    .lightbox-close{top:14px;right:14px}
  }

  .corretor-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:24px;transition:background .2s ease,border-color .2s ease,transform .2s var(--ease)}
  .corretor-card:hover{background:var(--surface-2);border-color:var(--line-strong);transform:translateY(-2px)}
  .corretor-logo{width:64px;height:64px;border-radius:18px;object-fit:contain;background:#fff;flex-shrink:0;box-shadow:0 8px 20px -4px rgba(0,0,0,.4)}
  .corretor-avatar-fallback{width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,var(--purple-light),var(--purple-dark));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 8px 20px -4px rgba(0,0,0,.4)}
  .corretor-info{flex:1;min-width:0}
  .corretor-label{font-size:11.5px;color:var(--t-40);margin-bottom:3px;font-weight:600}
  .corretor-name{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--t-100);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
  .corretor-creci{font-size:12px;color:var(--t-40);font-weight:600}
  .corretor-cta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--t-100);font-weight:700;white-space:nowrap;flex-shrink:0;background:var(--surface-2);padding:9px 14px;border-radius:11px;transition:background .18s}
  .corretor-card:hover .corretor-cta{background:var(--purple);color:#fff}
  .corretor-cta svg{width:13px;height:13px}

  .price-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .price{font-size:clamp(28px,6vw,36px);font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
  .title{font-size:15.5px;color:var(--t-55);margin-bottom:6px;font-weight:600}
  .address{font-size:13.5px;color:var(--t-40);margin-bottom:24px;display:flex;align-items:center;gap:6px;font-weight:600}
  .address svg{width:13px;height:13px;flex-shrink:0}

  /* ── Curtir ─────────────────────────────── */
  .like-btn{
    display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:9px 14px;color:var(--t-55);font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    transition:border-color .2s,background .2s,color .2s,transform .2s var(--ease);
  }
  .like-btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
  .like-btn:hover{border-color:var(--line-strong)}
  .like-btn.liked{border-color:#e0245e;background:rgba(224,36,94,.1);color:#e0245e}
  .like-btn.liked svg{fill:#e0245e;stroke:#e0245e;transform:scale(1.15)}
  .like-btn:disabled{cursor:default}

  /* ── Fazer proposta ─────────────────────── */
  .proposta-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s ease}
  .proposta-overlay.open{opacity:1;visibility:visible}
  @media(min-width:640px){.proposta-overlay{align-items:center}}
  .proposta-card{background:var(--surface);border:1px solid var(--line-mid);border-radius:22px 22px 0 0;padding:26px 24px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:440px;transform:translateY(100%);transition:transform .35s var(--ease)}
  .proposta-overlay.open .proposta-card{transform:translateY(0)}
  @media(min-width:640px){.proposta-card{border-radius:22px}}
  .proposta-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .proposta-title{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .proposta-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:none;color:var(--t-70);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .proposta-sub{font-size:13px;color:var(--t-40);margin-bottom:20px;line-height:1.5}
  .proposta-field{margin-bottom:14px}
  .proposta-field label{display:block;font-size:12px;font-weight:700;color:var(--t-40);letter-spacing:.02em;margin-bottom:7px}
  .proposta-field input,.proposta-field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line-mid);border-radius:12px;color:var(--t-100);
    font:inherit;font-size:14.5px;padding:12px 14px;outline:none;transition:border-color .2s;resize:vertical;
  }
  .proposta-field input:focus,.proposta-field textarea:focus{border-color:var(--purple-light)}
  .proposta-field-row{display:flex;gap:10px}
  .proposta-field-row .proposta-field{flex:1}
  .proposta-field input[type="date"],.proposta-field input[type="time"]{color-scheme:dark}
  body.light-mode .proposta-field input[type="date"],body.light-mode .proposta-field input[type="time"]{color-scheme:light}
  .proposta-submit{width:100%;background:var(--purple);border:none;border-radius:12px;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:14px;cursor:pointer;transition:background .18s;margin-top:6px}
  .proposta-submit:hover{background:var(--purple-light)}
  .proposta-submit:disabled{opacity:.6;cursor:default}
  .proposta-feedback{font-size:13px;text-align:center;margin-top:12px;line-height:1.5}
  .proposta-feedback.ok{color:#4ade80}
  .proposta-feedback.err{color:#f87171}

  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:28px}

  /* ── Agendar visita / Simulador ─────────── */
  .specs-actions{margin:-16px 0 24px}
  .visita-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--surface);border:1.5px solid var(--line-strong);color:var(--t-100);
    font-size:14.5px;font-weight:700;padding:13px;border-radius:14px;cursor:pointer;
    transition:border-color .2s,background .2s,transform .18s var(--ease);font-family:inherit;
  }
  .visita-btn:hover{border-color:var(--purple-light);background:var(--surface-2)}
  .visita-btn:active{transform:scale(.98)}
  .visita-btn svg{width:17px;height:17px;flex-shrink:0}

  .simulador{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:28px}
  .simulador-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin-bottom:16px}
  .simulador-head svg{width:16px;height:16px;color:var(--purple-light);flex-shrink:0}
  .simulador-row{display:flex;gap:10px;margin-bottom:14px}
  .simulador-field{flex:1}
  .simulador-field label{display:block;font-size:11px;font-weight:700;color:var(--t-40);letter-spacing:.02em;margin-bottom:6px}
  .simulador-field input,.simulador-field select{
    width:100%;background:var(--surface-2);border:1px solid var(--line-mid);border-radius:10px;color:var(--t-100);
    font:inherit;font-size:13.5px;padding:10px 11px;outline:none;transition:border-color .2s;
  }
  .simulador-field input:focus,.simulador-field select:focus{border-color:var(--purple-light)}
  .simulador-result{background:var(--surface-2);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px}
  .simulador-result .val{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--purple-light)}
  .simulador-result .lbl{font-size:11.5px;color:var(--t-40);font-weight:600;margin-top:2px}
  .simulador-disclaimer{font-size:11px;color:var(--t-40);line-height:1.5;text-align:center}
  .description{font-size:15px;color:var(--t-70);line-height:1.7;margin-bottom:28px;white-space:pre-wrap;font-weight:500;overflow-wrap:anywhere;word-break:break-word}
  .spec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;transition:border-color .2s}
  .spec-val{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
  .spec-lbl{font-size:11px;color:var(--t-40);font-weight:600}

  .section-label{font-size:13px;font-weight:700;color:var(--t-40);letter-spacing:.02em;margin-bottom:14px}
  .features{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .features li{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--t-70);font-weight:600;transition:border-color .2s,background .2s}
  .features li:hover{border-color:var(--line-strong);background:var(--surface-2)}

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#25d366;color:#fff;font-size:15px;font-weight:700;
    padding:15px;border-radius:14px;text-decoration:none;margin-bottom:16px;
    transition:filter .18s,transform .18s var(--ease);
  }
  .cta:hover{filter:brightness(1.08)}
  .disclaimer{font-size:12.5px;color:var(--t-40);text-align:center;line-height:1.6}

  footer{text-align:center;padding:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--t-40)}
  footer a{color:var(--t-70);text-decoration:none;font-weight:700}

  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--base) 84%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex;justify-content:center;
  }
  .sticky-cta-row{width:100%;max-width:560px;display:flex;gap:10px}
  .sticky-cta a,.sticky-cta button{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#25d366;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:14px;text-decoration:none;
    border:none;font-family:inherit;cursor:pointer;
    transition:filter .18s,transform .18s var(--ease);
  }
  .sticky-cta a:hover,.sticky-cta button:hover{filter:brightness(1.08)}
  .sticky-cta a:active,.sticky-cta button:active{transform:scale(.98)}
  .sticky-cta svg{width:19px;height:19px;flex-shrink:0}
  .sticky-proposta-btn{background:var(--purple)!important}

  @media(max-width:480px){
    .hero{font-size:42px;padding:48px 20px}
    .corretor-card{gap:10px;padding:14px}
    .corretor-logo,.corretor-avatar-fallback{width:52px;height:52px}
    .corretor-name{white-space:normal;overflow:visible;text-overflow:clip}
    .corretor-cta{padding:9px 10px}
    .corretor-cta span{display:none}
  }
</style>
</head>
<body>

  <header>
    <a href="/index.html">
      <img src="/logo.svg" alt="Grupo Captar"/>
    </a>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
  </header>

  <main>
    <div class="wrap" id="content">
      <div class="skel skel-gallery"></div>
      <div class="skel skel-line" style="width:35%;height:30px"></div>
      <div class="skel skel-line" style="width:55%"></div>
      <div class="skel skel-line" style="width:45%"></div>
      <div class="skel-specs"><div class="skel skel-spec"></div><div class="skel skel-spec"></div><div class="skel skel-spec"></div></div>
    </div>
  </main>

  <footer>
    Anúncio de <a href="/index.html">Grupo Captar</a> — assessoria imobiliária &amp; inteligência artificial
  </footer>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this)fecharLightbox()">
    <button class="lightbox-close" onclick="fecharLightbox()" title="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lightbox-prev" id="lightbox-prev" onclick="event.stopPropagation();navegarLightbox(-1)" title="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img id="lightbox-img" src="" alt=""/>
    <button class="lightbox-next" id="lightbox-next" onclick="event.stopPropagation();navegarLightbox(1)" title="Próxima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <div class="proposta-overlay" id="proposta-overlay" onclick="if(event.target===this)fecharProposta()">
    <div class="proposta-card">
      <div class="proposta-head">
        <div class="proposta-title">Fazer uma proposta</div>
        <button class="proposta-close" onclick="fecharProposta()" title="Fechar">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="proposta-sub" id="proposta-sub">Deixe seu nome e telefone que o corretor te procura direto.</div>
      <form id="proposta-form" onsubmit="return enviarProposta(event)">
        <div class="proposta-field">
          <label for="proposta-nome">Seu nome</label>

// Monta o número com DDI 55 pro wa.me, sem duplicar quando o telefone já
// foi salvo com o código do país. BR local = 10-11 dígitos; com DDI = 12-13.
function waPhoneBR(tel){
  let d=String(tel||'').replace(/\D/g,'');

function initialsOf(nome){
  const parts=String(nome||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(w=>w[0]||'').join('').toUpperCase()||'?';
}

// Formata um valor de área isolado: se for só número (com . ou , de milhar),
// assume m² — mas respeita o texto se o corretor já digitou a unidade (ex: "12 ha").
function formatAreaValor(v){
  v=String(v||'').trim();
  if(!v)return'';
  if(/^\d+$/.test(v))return v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' m²';
  return /^[\d.,]+$/.test(v)?v+' m²':v;
}
// im.area é salvo como "área construída / área do terreno" (ou só uma das duas)
function formatAreaParts(raw){
  return String(raw||'').split(' / ').map(p=>p.trim()).filter(Boolean).map(formatAreaValor);
}

// Financiamento — cálculo padrão de amortização (Tabela Price), com uma
// taxa de referência fixa só pra dar uma ideia de valor — deixamos bem
// claro no disclaimer que não é uma oferta de crédito real.
const TAXA_MENSAL_REFERENCIA = 0.0079; // ~9,9% a.a.
function atualizarSimulacao(preco){
  const entradaEl = document.getElementById('sim-entrada');
  const prazoEl = document.getElementById('sim-prazo');
  const resultEl = document.getElementById('simulador-result');
  if(!entradaEl || !prazoEl || !resultEl) return;
  const entrada = Math.min(Math.max(Number(entradaEl.value) || 0, 0), preco);
  const prazo = Number(prazoEl.value) || 360;
  const principal = preco - entrada;
  const i = TAXA_MENSAL_REFERENCIA;
  const parcela = principal > 0 ? (principal * i * Math.pow(1 + i, prazo)) / (Math.pow(1 + i, prazo) - 1) : 0;
  resultEl.innerHTML = `
    <div class="val">R$ ${parcela.toLocaleString('pt-BR', {maximumFractionDigits: 0})}</div>
    <div class="lbl">por mês, em até ${prazo} parcelas</div>
  `;
}

  const dataEl = document.getElementById('visita-data');
  if(dataEl) dataEl.min = new Date().toISOString().slice(0, 10);
  setTimeout(() => document.getElementById('visita-nome')?.focus(), 260);
}
function fecharVisita(){
  document.getElementById('visita-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

    return false;
  }
  const nome = document.getElementById('visita-nome').value.trim();
  const tel = document.getElementById('visita-tel').value.trim();
  const data = document.getElementById('visita-data').value;
  const hora = document.getElementById('visita-hora').value;
  const btn = document.getElementById('visita-submit-btn');
  const feedback = document.getElementById('visita-feedback');
  btn.disabled = true;
  btn.textContent = 'Agendando…';
  feedback.textContent = '';
  feedback.className = 'proposta-feedback';
  try {
    const { error } = await _sb.rpc('agendar_visita_publica', {
      p_user_id: _propostaCtx.userId,
      p_nome: nome,
      p_tel: tel,
      p_data: data,
      p_hora: hora,
      p_imovel_titulo: _propostaCtx.titulo
    });
    if(error) throw error;
    feedback.textContent = 'Visita agendada! O corretor vai confirmar com você.';
    feedback.className = 'proposta-feedback ok';
    document.getElementById('visita-form').reset();
    setTimeout(fecharVisita, 1800);
  } catch(e) {
    feedback.textContent = 'Não deu pra agendar agora. Tenta de novo em instantes, ou fala direto pelo WhatsApp.';
    feedback.className = 'proposta-feedback err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Confirmar visita';
  }
  return false;
}

function registrarCliqueWhatsapp(id){
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'whatsapp' }).then(() => {}, () => {});
}

// Curtir — um clique por imóvel por navegador (guardado no localStorage,
// não é à prova de tudo, mas evita o caso óbvio de recarregar a página
// pra inflar o número).
function curtirImovel(id){
  const btn = document.getElementById('like-btn');
  const countEl = document.getElementById('like-count');
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('liked');
  countEl.textContent = String(Number(countEl.textContent || 0) + 1);
  localStorage.setItem('captar_curtiu_' + id, '1');
  const desfazer = () => {
    btn.disabled = false;
    btn.classList.remove('liked');
    countEl.textContent = String(Math.max(0, Number(countEl.textContent || 1) - 1));
    localStorage.removeItem('captar_curtiu_' + id);
  };
  // O client do Supabase RESOLVE a promise mesmo quando a function do
  // Postgres deu raise exception — o erro vem dentro de { error }, não
  // por rejeição da promise. .then(ok, fail) sozinho nunca pegaria isso.
  _sb.rpc('registrar_evento_imovel_publico', { p_id: String(id), p_evento: 'like' })
    .then(({ error }) => { if(error) desfazer(); }, desfazer);
}

// Proposta — vira um lead de verdade no CRM do corretor (ver
// supabase-propostas-publicas.sql / enviar_proposta_publica).
function abrirProposta(){
  const sub = document.getElementById('proposta-sub');
  if(sub) sub.textContent = `Deixe seu nome e telefone que o corretor te procura sobre "${_propostaCtx.titulo}".`;
  document.getElementById('proposta-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('proposta-nome')?.focus(), 260);
}
function fecharProposta(){
  document.getElementById('proposta-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
async function enviarProposta(event){
  event.preventDefault();
  if(!_propostaCtx.userId){
    document.getElementById('proposta-feedback').textContent = 'Não foi possível identificar o corretor deste anúncio.';
    document.getElementById('proposta-feedback').className = 'proposta-feedback err';
    return false;
  }
  const nome = document.getElementById('proposta-nome').value.trim();
  const tel = document.getElementById('proposta-tel').value.trim();
  const valor = document.getElementById('proposta-valor').value.trim();
  const msg = document.getElementById('proposta-msg').value.trim();
  const btn = document.getElementById('proposta-submit-btn');
  const feedback = document.getElementById('proposta-feedback');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  feedback.textContent = '';
  feedback.className = 'proposta-feedback';
  try {
    const { error } = await _sb.rpc('enviar_proposta_publica', {
      p_user_id: _propostaCtx.userId,
      p_nome: nome,
      p_tel: tel,
      p_mensagem: msg,
      p_imovel_titulo: _propostaCtx.titulo,
      p_valor_oferta: valor
    });
    if(error) throw error;
    feedback.textContent = 'Proposta enviada! O corretor vai te procurar em breve.';
    feedback.className = 'proposta-feedback ok';
    document.getElementById('proposta-form').reset();
    setTimeout(fecharProposta, 1800);
  } catch(e) {
    feedback.textContent = 'Não deu pra enviar agora. Tenta de novo em instantes, ou fala direto pelo WhatsApp.';
    feedback.className = 'proposta-feedback err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar proposta';
  }
  return false;
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.getElementById('proposta-overlay')?.classList.contains('open')) fecharProposta();
  if(e.key === 'Escape' && document.getElementById('visita-overlay')?.classList.contains('open')) fecharVisita();
});

load();
